<script>
{
const BR='#943a22',GR='#3bdc5a',TE='#0d7380',YE='#ffe600',OR='#ff6a13';
const ITEMS={hh_n:{l:'Nieuwe handhole',sh:'sq',f:BR,s:GR,g:'Nieuw'},kp_n:{l:'Nieuwe koppeling',sh:'ci',f:BR,s:GR,g:'Nieuw'},
 inv:{l:'Invoering (gat boren)',sh:'ci',f:BR,s:GR,t:'IN',g:'Nieuw'},brw:{l:'Invoer brandwerend',sh:'ci',f:BR,s:GR,dash:1,g:'Nieuw'},
 gmb:{l:'Boring met mantelbuis',sh:'ci',f:BR,s:GR,t:'GmB',g:'Boring / persing'},gzb:{l:'Boring zonder buis',sh:'ci',f:BR,s:GR,t:'GzB',g:'Boring / persing'},
 per:{l:'Persing',sh:'ci',f:BR,s:GR,t:'P',g:'Boring / persing'},lmb:{l:'Leggen mantelbuis',sh:'ci',f:BR,s:GR,t:'L',g:'Boring / persing'},bb:{l:'Boogboring',sh:'ci',f:BR,s:GR,t:'BB',g:'Boring / persing'},
 hh_b:{l:'Bestaande handhole',sh:'sq',f:TE,s:YE,g:'Bestaand'},kp_b:{l:'Bestaande koppeling',sh:'ci',f:TE,s:YE,g:'Bestaand'},
 srv:{l:'Serverkast',sh:'rc',f:'#fff',s:GR,g:'Binnen'},fdb:{l:'FDB lasbox',sh:'rc',f:BR,s:GR,t:'FDB',g:'Binnen'}};
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let db;

const st=(store,mode,fn)=>new Promise((res,rej)=>{const t=db.transaction(store,mode),q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
const getAll=()=>st('projects','readonly',s=>s.getAll());
const putProj=p=>{p.updated=Date.now();return st('projects','readwrite',s=>s.put(p));};
const delProj=id=>st('projects','readwrite',s=>s.delete(id));

const getBlob=k=>st('blobs','readonly',s=>s.get(k));

const urls={};

const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});

/* ---------- geometrie & gps ---------- */
const cm=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],cd=(a,b)=>{const q=b[0]**2+b[1]**2;return[(a[0]*b[0]+a[1]*b[1])/q,(a[1]*b[0]-a[0]*b[1])/q];};
let T=null;
function solve(){const A=cur.anchors.filter(a=>a.la!=null);if(A.length<2){T=null;return;}
 const la0=A[0].la,lo0=A[0].lo,cl=Math.cos(la0*Math.PI/180),toEN=(la,lo)=>[(lo-lo0)*cl*111320,(la-la0)*110540];
 const Q=A.map(a=>({a:[a.x,-a.y],b:toEN(a.la,a.lo)}));
 const m=cd([Q[1].b[0]-Q[0].b[0],Q[1].b[1]-Q[0].b[1]],[Q[1].a[0]-Q[0].a[0],Q[1].a[1]-Q[0].a[1]]);
 if(!isFinite(m[0])){T=null;return;}const z=cm(m,Q[0].a),t=[Q[0].b[0]-z[0],Q[0].b[1]-z[1]];
 T={m,t,scale:Math.hypot(...m),rot:Math.atan2(m[1],m[0])*180/Math.PI,toEN,
  toLL:(e,n)=>[la0+n/110540,lo0+e/(cl*111320)],
  err:Q.slice(2).map(q=>{const w=cm(m,q.a);return Math.hypot(w[0]+t[0]-q.b[0],w[1]+t[1]-q.b[1]);})};}
const img2ll=(x,y)=>{const z=cm(T.m,[x,-y]);return T.toLL(z[0]+T.t[0],z[1]+T.t[1]);};
const ll2img=(la,lo)=>{const[e,n]=T.toEN(la,lo),a=cd([e-T.t[0],n-T.t[1]],T.m);return[a[0],-a[1]];};
const len=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function meters(){if(!T)return null;let s=0;const o=[0];for(let i=1;i<cur.pts.length;i++){s+=len(cur.pts[i-1],cur.pts[i])*T.scale;o.push(s);}return o;}
let gps=null,watch=null,gpsErr='',gpsListeners=[];
function gpsOn(){if(watch!==null)return;if(!navigator.geolocation){gpsErr='Deze browser heeft geen gps';return;}
 watch=navigator.geolocation.watchPosition(p=>{gps={la:p.coords.latitude,lo:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};gpsErr='';gpsListeners.forEach(f=>f(gps));if(view==='proj'){drawHead();drawMap();}},
  e=>{gpsErr=e.code===1?'Geen toestemming voor locatie. Zet locatie aan voor deze site in je instellingen.':'Gps niet beschikbaar ('+e.message+')';gpsListeners.forEach(f=>f(null));if(view==='proj')drawHead();},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});}
function gpsOff(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;gps=null;}

  else o+=`<polygon points="${[[cx-rx*.75,cy-ry],[cx+rx*.75,cy-ry],[cx+rx,cy+ry],[cx-rx,cy+ry]].map(q=>q.join(',')).join(' ')}" fill="${I.f}" stroke="${I.s}" stroke-width="${sw}" stroke-linejoin="round"/>`;

function proposal(p,w,h){const i=cur.pts.indexOf(p),pr=cur.pts[i-1],nx=cur.pts[i+1];

 const has=!!ITEMS[p.it],arrows=[];
 if(pr||!nx)arrows.push([.5,.99,.5,has?.81:.74]);
 if(nx){const sx=.5+Math.sin(d)*.06,ex=Math.max(.06,Math.min(.94,.5+Math.sin(d)*.34)),ey=Math.max(.2,.64-Math.max(.12,Math.cos(d))*.28);arrows.push([sx,has?.63:.7,ex,ey]);}

function markEditor(p){const u=urls[p.photo];if(!u)return;closeSheet();

  const ov=document.createElement('div');ov.className='med';ov.innerHTML=`<div class="medtop"><b>Markeren · foto ${nums()[p.id]||''}</b><span>${ITEMS[p.it]?esc(ITEMS[p.it].l):'Geen item gekozen, alleen pijlen'}</span></div>

  document.body.appendChild(ov);const S=ov.querySelector('#msvg');
  const sc=()=>w/S.getBoundingClientRect().width;
  const draw=()=>{const k=sc(),r=13*k;let o=markLayer(p,m);if(ITEMS[p.it]&&m.sym)o+=`<ellipse cx="${m.sym.x*w}" cy="${m.sym.y*h}" rx="${m.sym.s*w}" ry="${m.sym.s*w*.45}" fill="transparent" data-h="sym"/>`;
   m.arrows.forEach((a,i)=>{o+=`<line x1="${a[0]*w}" y1="${a[1]*h}" x2="${a[2]*w}" y2="${a[3]*h}" stroke="transparent" stroke-width="${30*k}" data-sel="${i}"/>`;
    o+=`<circle cx="${a[0]*w}" cy="${a[1]*h}" r="${r*.8}" fill="#fff" stroke="${i===selA?'#ff6a13':'#1d2529'}" stroke-width="${3*k}" data-h="a${i}s"/><circle cx="${a[2]*w}" cy="${a[3]*h}" r="${r}" fill="${i===selA?'#ff6a13':'#fff'}" stroke="#1d2529" stroke-width="${3*k}" data-h="a${i}e"/>`;});
   if(ITEMS[p.it]&&m.sym){const rx=m.sym.s*w;o+=`<circle cx="${m.sym.x*w+rx*.62}" cy="${m.sym.y*h}" r="${r*.85}" fill="#fff" fill-opacity=".9" stroke="#ff6a13" stroke-width="${3*k}" data-h="sym"/>`;}
   S.innerHTML=o;};
  draw();addEventListener('resize',draw);
  let dr=null;const P=e=>{const q=S.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const r=q.matrixTransform(S.getScreenCTM().inverse());return[Math.max(0,Math.min(1,r.x/w)),Math.max(0,Math.min(1,r.y/h))];};
  S.addEventListener('pointerdown',e=>{const t=e.target;if(t.dataset.sel){selA=+t.dataset.sel;draw();return;}if(!t.dataset.h)return;e.preventDefault();S.setPointerCapture(e.pointerId);dr=t.dataset.h;const mm=dr.match(/^a(\d+)/);if(mm)selA=+mm[1];});
  S.addEventListener('pointermove',e=>{if(!dr)return;const[x,y]=P(e);if(dr==='sym'){m.sym.x=x;m.sym.y=y;}else{const mm=dr.match(/^a(\d+)([se])$/),a=m.arrows[+mm[1]];if(mm[2]==='s'){a[0]=x;a[1]=y;}else{a[2]=x;a[3]=y;}}draw();});
  const end=()=>{dr=null;};S.addEventListener('pointerup',end);S.addEventListener('pointercancel',end);
  const on=(id,f)=>{const el=ov.querySelector('#'+id);if(el)el.onclick=f;};
  const close=()=>{removeEventListener('resize',draw);ov.remove();};
  on('sMin',()=>{m.sym.s=Math.max(.04,m.sym.s/1.2);draw();});on('sPlus',()=>{m.sym.s=Math.min(.4,m.sym.s*1.2);draw();});
  on('aAdd',()=>{m.arrows.push([.35,.6,.65,.4]);selA=m.arrows.length-1;draw();});
  on('aDel',()=>{if(selA>=0&&m.arrows.length){m.arrows.splice(selA,1);selA=m.arrows.length-1;draw();}});

  on('mCancel',()=>{close();pointSheet(p.id,'foto');});
  on('mOff',()=>{push();delete p.mark;save();close();drawAll();pointSheet(p.id,'foto');});
  on('mOk',()=>{push();p.mark=m;save();close();drawAll();pointSheet(p.id,'foto');toast('Markering opgeslagen');});});}

 const W=Math.max(DS.x0+(H.length+1)*DS.dx+20,Math.min(560,(document.querySelector('.app')||{}).clientWidth||360)),Ht=DS.top*2+nb*DS.bh,yF=f=>DS.top+(mx-f)*DS.bh+DS.bh/2,xI=i=>DS.x0+i*DS.dx;

 if(IND.spoor.length){let d='';for(let k=0;k<=H.length;k++){const pts=IND.spoor.filter(s=>s.seg===k&&!s.pause);if(!pts.length)continue;
   const a=k>0?H[k-1].anker||{x:0,y:0}:{x:0,y:0},b=k<H.length&&H[k].anker?H[k].anker:pts[pts.length-1],L=segLen(k)||1,bx=b.x-a.x,by=b.y-a.y,bl=Math.hypot(bx,by)||1;
   const xa=xI(k),xb=k<H.length?xI(k+1):xI(k)+DS.dx*.8,fa=k>0?H[k-1].verdieping:0;let c=0,px=a.x,py=a.y;d+=`M${xa} ${yF(fa)+9}`;

 const key=[cur.base,z,T.m.map(v=>v.toFixed(7)),T.t.map(v=>v.toFixed(2))].join('|');let h='';
 for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){const tl=ll2img(t2lat(y,z),t2lon(x,z)),tr=ll2img(t2lat(y,z),t2lon(x+1,z)),bl=ll2img(t2lat(y+1,z),t2lon(x,z)),k=1.004/256;
  h+=`<image href="${B.url(z,x,y)}" width="256" height="256" preserveAspectRatio="none" transform="matrix(${((tr[0]-tl[0])*k).toFixed(5)} ${((tr[1]-tl[1])*k).toFixed(5)} ${((bl[0]-tl[0])*k).toFixed(5)} ${((bl[1]-tl[1])*k).toFixed(5)} ${tl[0].toFixed(2)} ${tl[1].toFixed(2)})"/>`;}
 return{key,html:h};}
let baseKey='';
function drawBase(){const g=$('base'),im=$('drawImg');if(!g)return;const on=T&&BASES[cur.base];
 if(!on){if(baseKey){g.innerHTML='';baseKey='';}if(im)im.style.opacity=1;return;}
 const r=baseSvg($('svg').getBoundingClientRect().width||400);if(r.key!==baseKey){g.innerHTML=r.html;baseKey=r.key;}
 if(im)im.style.opacity=cur.drawOp??.55;}
function drawBaseBar(){const b=$('basebar');if(!b)return;if(!T){b.hidden=true;return;}b.hidden=false;const v=cur.base||'uit';
 b.innerHTML=`<span class="bl">Ondergrond</span>${['uit','foto','kaart'].map(k=>`<button class="btn bb" data-base="${k}" aria-pressed="${v===k}">${k==='uit'?'Uit':BASES[k].l}</button>`).join('')}
 ${BASES[v]?`<label class="op"><span>Tekening</span><input type="range" id="opR" min="0" max="100" value="${Math.round((cur.drawOp??.55)*100)}" aria-label="Doorzichtigheid tekening"></label><span class="attr">${BASES[v].attr}</span>`:''}`;
 b.querySelectorAll('[data-base]').forEach(x=>x.onclick=()=>{cur.base=x.dataset.base==='uit'?'':x.dataset.base;save();drawBaseBar();drawBase();if(cur.base&&!navigator.onLine)toast('Geen internet: alleen eerder bekeken stukken luchtfoto zijn te zien.');});
 const r=$('opR');if(r)r.oninput=()=>{cur.drawOp=r.value/100;$('drawImg').style.opacity=cur.drawOp;save();};}

/* ---------- project-instellingen ---------- */
function projSheet(){const b=$('sheetBody'),n=cur.pts.filter(p=>p.photo).length;
 b.innerHTML=`<h2 style="font-size:22px">Project</h2><label for="pn">Naam / adres</label><input id="pn" value="${esc(cur.name)}"><label for="pa">Plaats / gebouw</label><input id="pa" value="${esc(cur.addr)}"><label for="ps">Projectnummer</label><input id="ps" value="${esc(cur.sid)}">
 <div class="row2"><button class="btn dk" id="pSave">Opslaan</button></div>
 <span class="lab">Route</span><div class="row2" style="margin-top:0"><button class="btn" id="reTr">Route opnieuw trekken</button></div><span class="lab">Foto's en opruimen</span><div class="row2" style="margin-top:0"><button class="btn" id="shP" ${n?'':'disabled'}>Foto's bewaren op telefoon</button><button class="btn" id="arcP">Archiveren</button></div><div class="row2"><button class="btn red" id="wipe" ${n?'':'disabled'}>${n} foto's wissen</button><button class="btn red" id="delP">Project verwijderen</button></div><p class="note" id="conf"></p>`;
 $('sheet').hidden=false;
 confirmTwice0($('reTr'),cur.pts.some(p=>p.photo||p.it)?'Punten met foto of item gaan verloren.':'',()=>{closeSheet();push();cur.pts.forEach(p=>p.photo&&delBlob(p.photo));cur.pts=[];save();startTrace();});
 $('pSave').onclick=()=>{cur.name=$('pn').value.trim()||cur.name;cur.addr=$('pa').value.trim();cur.sid=$('ps').value.trim();save();closeSheet();drawHead();};
 const confirmTwice=(btn,msg,fn)=>{let armed=false;btn.onclick=()=>{if(!armed){armed=true;btn.textContent='Zeker? Tik nog een keer';$('conf').textContent=msg;return;}fn();};};
 confirmTwice($('wipe'),'Maak eerst het rapport als PDF. Daarna zijn de foto\'s weg.',async()=>{for(const p of cur.pts)if(p.photo){await delBlob(p.photo);p.photo='';}if(cur.indoor)for(const h of cur.indoor.haltes){for(const k of h.fotos)await delBlob(k);h.fotos=[];}await putProj(cur);closeSheet();drawAll();});
 confirmTwice($('delP'),'Tekening, punten en foto\'s worden uit de app gewist. Foto\'s uit je galerij blijven daar staan.',async()=>{await deleteProject(cur);closeSheet();home();});
 $('shP').onclick=()=>sharePhotos(cur);$('arcP').onclick=async()=>{cur.archived=true;await putProj(cur);closeSheet();toast('Gearchiveerd');home();};}

/* ---------- rapport ---------- */
function report(){view='rep';gpsOff();const M=meters(),N=nums(),s=cur.W/700;
 const bs=T&&BASES[cur.base]?baseSvg(700):null;const mapSvg=`<svg viewBox="0 0 ${cur.W} ${cur.H}">${bs?bs.html:''}<image href="${drawUrl}" width="${cur.W}" height="${cur.H}" opacity="${bs?(cur.drawOp??.55):1}"/>${cur.pts.length>1?`<polyline points="${cur.pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${OR}" stroke-width="${3*s}" stroke-opacity=".6"/>`:''}${cur.pts.map(p=>sym(p.it,p.x,p.y,s*1.4,N[p.id])).join('')}</svg>`;
 const inv=cur.pts.findIndex(p=>p.it==='inv'||p.it==='brw');
 app.innerHTML=`<div class="tool noprint"><button class="btn" id="rb">‹ Terug</button><span class="sp"></span><button class="btn pri" id="pr">Afdrukken / PDF</button></div>
 <div class="rep"><h1 style="font-size:28px">${esc(cur.name)}</h1><p class="note">${esc(cur.sid)} · ${esc(cur.addr)} · ${new Date().toLocaleDateString('nl-NL')}</p>
 <table><tr><td>Lengte route</td><td class="n">${M?Math.round(M[M.length-1])+' m':'niet gekoppeld'}</td></tr>${inv>0&&M?`<tr><td>Buitentracé tot invoering</td><td class="n">${Math.round(M[inv])} m</td></tr>`:''}<tr><td>Punten / foto's</td><td class="n">${keyPts().length} / ${Object.keys(N).length}</td></tr><tr><td>Gps-koppeling</td><td class="n">${T?`${cur.anchors.length} ankers${T.err.length?`, afwijking ${T.err.map(e=>e.toFixed(1)).join('/')} m`:''}`:'geen'}</td></tr></table>
 <h2>Tracé</h2><div class="mapc">${mapSvg}</div>${bs?`<p class="note">${BASES[cur.base].attr}</p>`:''}
 <h2>Punten</h2><table><tr><th>#</th><th>Item</th><th>Omschrijving</th><th class="n">m</th></tr>${keyPts().map(({p,i},n)=>`<tr><td>${n+1}</td><td>${label(p)}${N[p.id]?` · foto ${N[p.id]}`:''}</td><td>${esc(p.c)}</td><td class="n">${M?Math.round(M[i]):''}</td></tr>`).join('')}</table>
 <h2>Foto's</h2><div class="pgrid">${cur.pts.filter(p=>p.photo&&urls[p.photo]).map(p=>`<figure>${photoHtml(p)}<figcaption><b>Foto ${N[p.id]}</b> · ${esc(p.c||label(p))}</figcaption></figure>`).join('')||'<p class="note">Geen foto\'s.</p>'}</div>${indoorReport()}</div>`;
 $('rb').onclick=()=>openProject(cur.id);$('pr').onclick=()=>window.print();}

init();
}
</script>
</body>
</html>
