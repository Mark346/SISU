<html lang="nl">
<head>
<meta charset="utf-8">

<title>Zoofi</title>

<body>
<header class="bar start metband" id="hbar"><button class="back bpill" id="hb" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Schouwen</button><img id="hlogo" class="hlogo" src="shared/icon-klein.svg" width="32" height="32" alt=""><h1 id="ttl">Zoofi</h1><a class="hbtn" href="instellingen.html" id="hset" aria-label="Instellingen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></a></header>
<div class="vezelband" id="hband" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<main class="page" id="main"></main>
<script src="shared/store.js"></script>
<script src="shared/legend.js"></script>
<script src="shared/camera.js"></script>
<script src="shared/editor.js"></script>
<script src="shared/velden.js"></script>
<script src="shared/gegevens.js"></script>
<script src="shared/paf.js"></script>
<script src="shared/kaarttrace.js"></script>
<script src="shared/docmodel.js"></script>
<script src="shared/pdfdoc.js"></script>
<script src="shared/survey-ui.js"></script>
<script>
/* Veeg & Klik: foto maken, route vegen, editor uit shared/editor.js */
function newPhoto(survey,galerij){
  Camera.take({galerij}).then(async r=>{
    const rol=SurveyUI.neemRol(); // verplichte foto (aansluitpunt, invoer pand, beginpunt)
    if(!r||!r.blob)return;
    const p=await Store.photos.put({surveyId:survey.id,blob:r.blob,ann:{orient:r.orient||'liggend'},bron:'veeg',status:'ok',sectie:Velden.onnet(SurveyUI.current()||survey)?'binnen':((SurveyUI.current()||survey).sectie||'buiten')});
    if(rol)await Gegevens.zetRol(p,rol,await Store.photos.bySurvey(survey.id,true));
    edit(survey,p.id);
  }).catch(()=>{SurveyUI.neemRol();SurveyUI.toast('Foto maken lukte niet');});
}
function edit(survey,id){
  Editor.openEditor(id,{
    onClose:()=>SurveyUI.show(survey),
    onChange:()=>SurveyUI.recount(),
    onNext:()=>{Editor.close();newPhoto(survey,false);},
    onDoc:()=>{location.href='shared/storyline.html?survey='+encodeURIComponent(survey.id);}
  }).catch(e=>SurveyUI.toast('Kon de foto niet openen: '+(e.message||e)));
}
SurveyUI.init({
  variant:'veeg',naam:'Veeg & Klik',startTitel:'Zoofi',metersZelf:true,typeKiezen:true,fotoVakken:true,
  startExtra:'<a class="slink" href="opties.html">Andere opties</a>',
  onScreen:w=>{const $=id=>document.getElementById(id),st=w==="start",b=$("hb");b.hidden=st;$("hlogo").hidden=!st;$("hset").hidden=!st;$("hband").hidden=false;$("hbar").classList.toggle("start",st);b.lastChild.textContent=w==="fotos"?"Schouw":"Schouwen";b.onclick=()=>SurveyUI.terug();},
  invoerUitleg:"Telt de app: IN-symbolen op geldige foto's.",
  acties:(s,n)=>[{label:`Foto ${n+1} maken`,pri:1,fn:s=>newPhoto(s,false)},{label:'Foto uit galerij',fn:s=>newPhoto(s,true)}],
  tellen:(s,ph)=>({invoeringen:ph.reduce((n,p)=>n+(((p.ann&&p.ann.syms)||[]).filter(x=>x.t==='dv').length),0)}),
  openFoto:(s,id)=>edit(s,id)
});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
