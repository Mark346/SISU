<style>

<body>
<div class="app" id="app"></div>
<div class="sheet" id="sheet" hidden><div id="sheetBody"></div></div>
<input type="file" id="fPick" accept="image/*">
<input type="file" id="fCam" accept="image/*" capture="environment">
<input type="file" id="fDraw" accept="image/*,application/pdf">
<script>
{
const BR='#943a22',GR='#3bdc5a',TE='#0d7380',YE='#ffe600';let OR='#ff6a13';
const ITEMS={hh_n:{l:'Nieuwe handhole',sh:'sq',f:BR,s:GR,g:'Nieuw'},kp_n:{l:'Nieuwe koppeling',sh:'ci',f:BR,s:GR,g:'Nieuw'},
 inv:{l:'Invoering (gat boren)',sh:'ci',f:BR,s:GR,t:'IN',g:'Nieuw'},brw:{l:'Invoer brandwerend',sh:'ci',f:BR,s:GR,dash:1,g:'Nieuw'},
 gmb:{l:'Boring met mantelbuis',sh:'ci',f:BR,s:GR,t:'GmB',g:'Boring / persing'},gzb:{l:'Boring zonder buis',sh:'ci',f:BR,s:GR,t:'GzB',g:'Boring / persing'},
 per:{l:'Persing',sh:'ci',f:BR,s:GR,t:'P',g:'Boring / persing'},lmb:{l:'Leggen mantelbuis',sh:'ci',f:BR,s:GR,t:'L',g:'Boring / persing'},bb:{l:'Boogboring',sh:'ci',f:BR,s:GR,t:'BB',g:'Boring / persing'},
 hh_b:{l:'Bestaande handhole',sh:'sq',f:TE,s:YE,g:'Bestaand'},kp_b:{l:'Bestaande koppeling',sh:'ci',f:TE,s:YE,g:'Bestaand'},
 srv:{l:'Serverkast',sh:'rc',f:'#fff',s:GR,g:'Binnen'},fdb:{l:'FDB lasbox',sh:'rc',f:BR,s:GR,t:'FDB',g:'Binnen'}};
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- opslag (IndexedDB) ---------- */
let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('schouw',1);r.onupgradeneeded=()=>{r.result.createObjectStore('projects',{keyPath:'id'});r.result.createObjectStore('blobs');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const st=(store,mode,fn)=>new Promise((res,rej)=>{const t=db.transaction(store,mode),q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
const getAll=()=>st('projects','readonly',s=>s.getAll());
const putProj=p=>{p.updated=Date.now();return st('projects','readwrite',s=>s.put(p));};
const delProj=id=>st('projects','readwrite',s=>s.delete(id));
const putBlob=(k,b)=>st('blobs','readwrite',s=>s.put(b,k));
const getBlob=k=>st('blobs','readonly',s=>s.get(k));
const delBlob=k=>st('blobs','readwrite',s=>s.delete(k));
const urls={};
async function url(k){if(!k)return'';if(!urls[k]){const b=await getBlob(k);urls[k]=b?URL.createObjectURL(b):'';}return urls[k];}
async function shrink(file,max=1600){const img=await loadImg(URL.createObjectURL(file));const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);return new Promise(r=>c.toBlob(r,'image/jpeg',.82));}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
let saveT=null;const save=()=>{clearTimeout(saveT);const c=cur;saveT=setTimeout(()=>{saveT=null;if(c)putProj(c);},300);};

/* ---------- symbolen ---------- */
function sym(it,cx,cy,s,num){let o='';const I=ITEMS[it],r=10*s;
 if(!I){if(num)o+=`<circle cx="${cx}" cy="${cy}" r="${11*s}" fill="#fff" stroke="${OR}" stroke-width="${3.2*s}"/><text x="${cx}" y="${cy+4*s}" font-size="${11.5*s}" font-weight="700" text-anchor="middle" fill="#1b1b1b" font-family="Barlow,sans-serif">${num}</text>`;
  else o+=`<circle cx="${cx}" cy="${cy}" r="${5*s}" fill="#fff" stroke="#1b1b1b" stroke-width="${1.8*s}"/>`;return o;}
 const sw=2.4*s;
 if(I.sh==='sq')o+=`<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" fill="${I.f}" stroke="${I.s}" stroke-width="${sw}"/>`;
 else if(I.sh==='rc')o+=`<rect x="${cx-r*.8}" y="${cy-r*1.15}" width="${1.6*r}" height="${2.3*r}" fill="${I.f}" stroke="${I.s}" stroke-width="${sw}"/>`;
 else o+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${I.f}" stroke="${I.s}" stroke-width="${sw}" ${I.dash?`stroke-dasharray="${2*s} ${1.5*s}"`:''}/>`;
 if(I.t)o+=`<text x="${cx}" y="${cy+(I.t.length>2?3:4)*s}" font-size="${(I.t.length>2?7.5:11)*s}" font-weight="700" text-anchor="middle" fill="#fff" font-family="Barlow,sans-serif">${I.t}</text>`;
 if(num)o+=`<circle cx="${cx+r*.95}" cy="${cy-r*.95}" r="${7.5*s}" fill="${OR}" stroke="#fff" stroke-width="${1.6*s}"/><text x="${cx+r*.95}" y="${cy-r*.95+3.3*s}" font-size="${9.5*s}" font-weight="700" text-anchor="middle" fill="#fff" font-family="Barlow,sans-serif">${num}</text>`;
 return o;}
const icon=(it,num,w=40,h=34)=>`<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${sym(it,w/2-(ITEMS[it]&&num?3:0),h/2+(ITEMS[it]&&num?3:0),1,num)}</svg>`;
const endKind=p=>{const P=cur&&cur.pts;if(!P||P.length<2)return'';return p===P[0]?'net':p===P[P.length-1]?'pand':'';};
const END={net:'Aansluiting netwerk',pand:'Invoer pand'};
const label=p=>ITEMS[p.it]?.l||END[endKind(p)]||(p.photo?'Fotopunt':'Routepunt');
function endSym(k,x,y,s){if(k==='net')return`<circle cx="${x}" cy="${y}" r="${9*s}" fill="#1d2529" stroke="#fff" stroke-width="${2.2*s}"/><circle cx="${x}" cy="${y}" r="${3.4*s}" fill="#ff6a13"/>`;
 const r=9*s;return`<path d="M${x} ${y-r*1.15} L${x+r} ${y-r*.2} L${x+r} ${y+r} L${x-r} ${y+r} L${x-r} ${y-r*.2}Z" fill="#1d2529" stroke="#fff" stroke-width="${2*s}" stroke-linejoin="round"/><rect x="${x-r*.32}" y="${y+r*.15}" width="${r*.64}" height="${r*.85}" fill="#ff6a13"/>`;}
function endTag(k,x,y,s){const txt=k==='net'?'Netwerk':'Pand',fs=10.5*s,w=(txt.length*5.6+10)*s,h=15*s;let tx=x+13*s,ty=y-22*s;if(tx+w>cur.W-2)tx=x-13*s-w;if(ty<2)ty=y+8*s;
 return`<rect x="${tx}" y="${ty}" width="${w}" height="${h}" rx="${3*s}" fill="#1d2529" fill-opacity=".9"/><text x="${tx+5*s}" y="${ty+11*s}" font-size="${fs}" font-weight="600" fill="#fff" font-family="Barlow,sans-serif">${txt}</text>`;}

/* ---------- geometrie & gps ---------- */
const cm=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],cd=(a,b)=>{const q=b[0]**2+b[1]**2;return[(a[0]*b[0]+a[1]*b[1])/q,(a[1]*b[0]-a[0]*b[1])/q];};
let T=null;
function solve(){let A=cur.anchors.filter(a=>a.la!=null),via='gps';if(A.length<2){if(cur.addrFit&&cur.addrFit.v){A=cur.addrFit.v;via='adres';}else{T=null;return;}}
 const la0=A[0].la,lo0=A[0].lo,cl=Math.cos(la0*Math.PI/180),toEN=(la,lo)=>[(lo-lo0)*cl*111320,(la-la0)*110540];
 const Q=A.map(a=>({a:[a.x,-a.y],b:toEN(a.la,a.lo)}));
 const m=cd([Q[1].b[0]-Q[0].b[0],Q[1].b[1]-Q[0].b[1]],[Q[1].a[0]-Q[0].a[0],Q[1].a[1]-Q[0].a[1]]);
 if(!isFinite(m[0])){T=null;return;}const z=cm(m,Q[0].a),t=[Q[0].b[0]-z[0],Q[0].b[1]-z[1]];
 T={via,m,t,scale:Math.hypot(...m),rot:Math.atan2(m[1],m[0])*180/Math.PI,toEN,
  toLL:(e,n)=>[la0+n/110540,lo0+e/(cl*111320)],
  err:Q.slice(2).map(q=>{const w=cm(m,q.a);return Math.hypot(w[0]+t[0]-q.b[0],w[1]+t[1]-q.b[1]);})};}
const img2ll=(x,y)=>{const z=cm(T.m,[x,-y]);return T.toLL(z[0]+T.t[0],z[1]+T.t[1]);};
const ll2img=(la,lo)=>{const[e,n]=T.toEN(la,lo),a=cd([e-T.t[0],n-T.t[1]],T.m);return[a[0],-a[1]];};
const len=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function meters(){if(!T)return null;let s=0;const o=[0];for(let i=1;i<cur.pts.length;i++){s+=len(cur.pts[i-1],cur.pts[i])*T.scale;o.push(s);}return o;}
let gps=null,watch=null,gpsErr='',gpsListeners=[];
function gpsOn(){if(watch!==null)return;if(!navigator.geolocation){gpsErr='Deze browser heeft geen gps';return;}
 watch=navigator.geolocation.watchPosition(p=>{gps={la:p.coords.latitude,lo:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};gpsErr='';gpsListeners.forEach(f=>f(gps));if(view==='proj'){drawHead();drawMap();navOnGps();}},
  e=>{gpsErr=e.code===1?'Geen toestemming voor locatie. Zet locatie aan voor deze site in je instellingen.':'Gps niet beschikbaar ('+e.message+')';gpsListeners.forEach(f=>f(null));if(view==='proj')drawHead();},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});}
function gpsOff(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;gps=null;}

/* ---------- toestand ---------- */
let editRoute=false,trace=null,progScroll=false,wiz=null,ghost=null,pendingAdd=null,view='home',cur=null,drawUrl='',mask=null,sel=null,addMode=false,snap=true,zoom=1,follow=false,hist=[],placeHere=false;
const push=()=>{hist.push(JSON.stringify(cur.pts));hist.length>50&&hist.shift();};
function nums(){let n=0;const m={};cur.pts.forEach(p=>{if(p.photo)m[p.id]=++n;});return m;}

/* ---------- start ---------- */
async function init(){applyContrast();try{db=await openDB();}catch(e){app.innerHTML='<p class="sec warn">Opslag niet beschikbaar in deze browser (privémodus?).</p>';return;}
 navigator.storage?.persist?.();
 const all=await getAll();if(!all.length&&!localStorage.getItem('demoMade')){await makeDemo();localStorage.setItem('demoMade','1');}
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
 home();}
async function makeDemo(){try{const b=await (await fetch('voorbeeld-tekening.jpg')).blob();const k='d_'+uid();await putBlob(k,b);
 const pts=[[400,466,'hh_n','Nieuw te leggen DB7 vanuit nieuwe handhole uit ander project.'],[349,416,'','Nieuw te leggen DB7.'],[319,390,'',''],[271,345,'','Nieuw te leggen DB7.'],[234,297,'',''],[200,249,'','Nieuw te leggen DB7.'],[163,200,'','Nieuw te leggen DB7.'],[143,170,'',''],[124,179,'kp_n','Nieuw te leggen DB7 en nieuw te plaatsen buiskoppeling en nieuw te leggen DB2.'],[96,188,'inv','Nieuw te leggen DB2 en hier komt de invoering door middel van een gat te boren.'],[54,173,'srv','Nieuw te plaatsen ODF-lade op hoogte 1 HE.']].map(a=>({id:uid(),x:a[0],y:a[1],it:a[2],c:a[3],photo:''}));
 await putProj({id:uid(),name:'Voorbeeld – Opaallaan 372',addr:'Hoofddorp · HFD0388',sid:'SID000892476',draw:k,W:429,H:640,pts,anchors:[],created:Date.now()});}catch(e){}}

/* ---------- home ---------- */
let showArch=false;const fotos=n=>n+(n===1?' foto':" foto's");
async function home(){view='home';stopSensors();document.body.classList.remove('indoor');cur=null;gpsOff();hist=[];document.body.classList.remove('wiz','trace');
 const all=(await getAll()).sort((a,b)=>b.updated-a.updated),act=all.filter(p=>!p.archived),arc=all.filter(p=>p.archived);
 const th={};await Promise.all(all.map(async p=>th[p.id]=await url(p.draw)));
 const row=p=>`<div class="proj" data-p="${p.id}"><div class="th">${th[p.id]?`<img src="${th[p.id]}" alt="">`:''}</div><div><b>${esc(p.name)}</b><span>${esc(p.addr)}${p.addr?' · ':''}${p.pts.length} punten · ${fotos(p.pts.filter(q=>q.photo).length)} · ${new Date(p.updated).toLocaleDateString('nl-NL')}</span></div><button class="btn more" data-m="${p.id}" aria-label="Opties voor ${esc(p.name)}">⋯</button></div>`;
 app.innerHTML=`<div class="top"><small>Schouw · veldtest</small><h1>Projecten</h1></div>
 <div class="sec"><button class="btn pri" id="newP" style="width:100%">+ Nieuw project</button>
 ${act.map(row).join('')||'<p class="note" style="margin-top:14px">Geen actieve projecten.</p>'}
 ${arc.length?`<button class="btn" id="arcT" style="width:100%;margin-top:16px">${showArch?'▾':'▸'} Archief (${arc.length})</button>${showArch?`<div class="arch">${arc.map(row).join('')}</div>`:''}`:''}
 <p class="note" style="margin-top:20px">Alles wordt alleen op deze telefoon bewaard, in de opslag van de app. Tip: zet de app op je beginscherm via Delen → "Zet op beginscherm".</p></div>`;
 $('newP').onclick=newProject;$('arcT')&&($('arcT').onclick=()=>{showArch=!showArch;home();});
 app.querySelectorAll('[data-p]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('[data-m]'))return;openProject(e.dataset.p);});
 app.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>projActions(all.find(p=>p.id===e.dataset.m)));}
function projActions(p){const n=p.pts.filter(q=>q.photo).length,b=$('sheetBody');
 b.innerHTML=`<h2 style="font-size:22px">${esc(p.name)}</h2><p class="note">${p.pts.length} punten · ${fotos(n)}${p.archived?' · gearchiveerd':''}</p>
 <div class="meth" style="margin-top:12px">${n?`<button class="btn" id="aSh"><b>Foto's bewaren op telefoon</b><small>Via delen: kies "Bewaar afbeeldingen" (iPhone) of "Opslaan" (Android).</small></button>`:''}
 <button class="btn" id="aArc"><b>${p.archived?'Terugzetten uit archief':'Archiveren'}</b><small>${p.archived?'Het project komt weer bij de actieve projecten.':'Het project verdwijnt uit de lijst, maar blijft met alle foto\'s bewaard.'}</small></button>
 <button class="btn red" id="aDel"><b>Verwijderen</b><small>Tekening, punten en ${fotos(n)} worden uit de app gewist. Foto's die je uit je galerij hebt gekozen, blijven daar gewoon staan.</small></button></div>
 <p class="note warn" id="conf"></p><div class="row2"><button class="btn dk" id="aClose">Sluiten</button></div>`;
 $('sheet').hidden=false;$('aClose').onclick=closeSheet;

/* ---------- binnentracé: data ---------- */
const ROOMS=['Gang','Kelder','Schacht','MER','Trappenhuis','Plafond','Doorvoer','Patchkast'];
const VERB=['kabelgoot','buis','boven plafond','onder vloer','door wand/vloer (doorvoer)','anders'];
const isDoor=v=>v&&v.type==='door wand/vloer (doorvoer)';
const isKast=h=>/^(MER|Patchkast|Serverkast)$/i.test(h.ruimtetype||'');
const r1=v=>Math.round(v*10)/10,fmtM=v=>String(r1(v)).replace('.',',');
let IND=null,sens=null,wl=null;
function ensureIndoor(mode){const inv=cur.pts.find(p=>p.it==='inv'||p.it==='brw');
 if(!cur.indoor)cur.indoor={id:uid(),schouwId:cur.id,modus:mode,startpunt:inv?{type:'IN',ptId:inv.id}:{type:'voordeur'},haltes:[],spoor:[],floor:0};
 else if(cur.indoor.startpunt.type==='voordeur'&&inv)cur.indoor.startpunt={type:'IN',ptId:inv.id};
 return cur.indoor;}
const renum=()=>IND.haltes.forEach((h,i)=>h.nummer=i+1);
function fotoNrs(){let n=0;const m={};IND.haltes.forEach(h=>h.fotos.forEach(k=>m[k]=++n));return m;}
function roomList(){const u=ls.get('roomUse',{}),all=[...ROOMS,...ls.get('roomCustom',[])];return all.map((v,i)=>({v,i,n:u[v]||0})).sort((a,b)=>b.n-a.n||a.i-b.i).map(x=>x.v);}
function segLen(k){const prev=k>0?IND.haltes[k-1].anker:null;let x=prev?prev.x:0,y=prev?prev.y:0,L=0,any=false;
 for(const s of IND.spoor){if(s.seg!==k)continue;any=true;if(s.pause){L+=s.len||0;continue;}L+=Math.hypot(s.x-x,s.y-y);x=s.x;y=s.y;}return any?L:null;}
const curPos=()=>{for(let i=IND.spoor.length-1;i>=0;i--)if(!IND.spoor[i].pause)return IND.spoor[i];return{x:0,y:0,c:0};};

/* ---------- binnentracé: doorsnede ---------- */
const DS={dx:72,x0:54,bh:62,top:8};
function dsSvg(hl=-1,drag=null){const H=IND.haltes,fl=[0,IND.floor,...H.map(h=>h.verdieping)],mn=Math.min(...fl),mx=Math.max(...fl),nb=mx-mn+1;
 const W=Math.max(DS.x0+(H.length+1)*DS.dx+20,Math.min(560,(document.querySelector('.app')||{}).clientWidth||360)),Ht=DS.top*2+nb*DS.bh,yF=f=>DS.top+(mx-f)*DS.bh+DS.bh/2,xI=i=>DS.x0+i*DS.dx;
 let o='';for(let f=mx;f>=mn;f--){const y=DS.top+(mx-f)*DS.bh;o+=`<rect x="0" y="${y}" width="${W}" height="${DS.bh}" fill="${f%2?'#eef0ee':'#f7f8f7'}"/><line x1="0" x2="${W}" y1="${y+DS.bh}" y2="${y+DS.bh}" stroke="#d9ddda"/><g class="fl" data-f="${f}"><rect x="0" y="${y}" width="58" height="26" fill="transparent"/><text x="8" y="${y+17}" font-size="13" font-weight="700" fill="${contrast?'#000':'#5d676c'}" font-family="Barlow,sans-serif">${f<0?'−'+(-f):f}${f===-1?' kelder':''}</text></g>`;}
 // spoor: grijze stippellijn achter de route
 if(IND.spoor.length){let d='';for(let k=0;k<=H.length;k++){const pts=IND.spoor.filter(s=>s.seg===k&&!s.pause);if(!pts.length)continue;
   const a=k>0?H[k-1].anker||{x:0,y:0}:{x:0,y:0},b=k<H.length&&H[k].anker?H[k].anker:pts[pts.length-1],L=segLen(k)||1,bx=b.x-a.x,by=b.y-a.y,bl=Math.hypot(bx,by)||1;
   const xa=xI(k),xb=k<H.length?xI(k+1):xI(k)+DS.dx*.8,fa=k>0?H[k-1].verdieping:0;let c=0,px=a.x,py=a.y;d+=`M${xa} ${yF(fa)+9}`;
   for(const s of pts){c+=Math.hypot(s.x-px,s.y-py);px=s.x;py=s.y;const off=Math.max(-14,Math.min(14,((s.x-a.x)*by-(s.y-a.y)*bx)/bl*2));d+=` L${(xa+(xb-xa)*Math.min(1,c/L)).toFixed(1)} ${(yF(s.verdieping)+9+off).toFixed(1)}`;}}
  o+=`<path d="${d}" fill="none" stroke="#8a9397" stroke-width="1.6" stroke-dasharray="3 3"/>`;}
 // route
 let p=`M${xI(0)} ${yF(0)}`,pf=0;H.forEach((h,i)=>{const x=xI(i+1);if(h.verdieping!==pf)p+=` L${x} ${yF(pf)} L${x} ${yF(h.verdieping)}`;else p+=` L${x} ${yF(h.verdieping)}`;pf=h.verdieping;});
 o+=`<path d="${p}" fill="none" stroke="${OR}" stroke-width="${contrast?10:7}" stroke-linejoin="round" stroke-linecap="round"/>`;DS.last={W,Ht,mx,mn,path:p};
 // start
 const sx=xI(0),sy=yF(0);o+=IND.startpunt.type==='IN'?`<circle cx="${sx}" cy="${sy}" r="13" fill="#943a22" stroke="#3bdc5a" stroke-width="3"/><text x="${sx}" y="${sy+4.5}" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" font-family="Barlow,sans-serif">IN</text>`
  :`<path d="M${sx} ${sy-14} L${sx+13} ${sy-3} V${sy+12} H${sx-13} V${sy-3}Z" fill="#1d2529" stroke="#fff" stroke-width="2"/><rect x="${sx-4}" y="${sy+2}" width="8" height="10" fill="#ff6a13"/>`;
 o+=`<text x="${sx}" y="${sy+28}" font-size="11" text-anchor="middle" fill="#5d676c" font-family="Barlow,sans-serif">${IND.startpunt.type==='IN'?'Invoering':'Voordeur'}</text>`;
 H.forEach((h,i)=>{let x=xI(i+1);const y=yF(h.verdieping),ph=h.fotos.length>0,hi=i===hl,st=ph?'#ff6a13':'#1d2529',sw=ph?4:2.5;
  if(drag&&drag.i===i)x=drag.x;
  o+=`<g class="hl" data-h="${i}">${hi?`<circle cx="${x}" cy="${y}" r="22" fill="none" stroke="#1d2529" stroke-width="2" stroke-dasharray="4 3"/>`:''}`;
  o+=isKast(h)?`<rect x="${x-13}" y="${y-11}" width="26" height="22" rx="2" fill="#fff" stroke="${ph?'#ff6a13':'#3bdc5a'}" stroke-width="${sw}"/>`:`<circle cx="${x}" cy="${y}" r="12" fill="#fff" stroke="${st}" stroke-width="${sw}"/>`;
  o+=`<text x="${x}" y="${y+4.5}" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1b1b1b" font-family="Barlow,sans-serif">${i+1}</text>`;
  o+=`<text x="${x}" y="${y+28}" font-size="11" text-anchor="middle" fill="#5d676c" font-family="Barlow,sans-serif">${esc((h.ruimtetype||'Halte').slice(0,11))}</text><circle cx="${x}" cy="${y}" r="24" fill="transparent"/></g>`;});
 return`<svg viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" class="dsv">${o}</svg>`;}

/* ---------- binnentracé: scherm ---------- */
function openIndoor(mode,ptId){IND=ensureIndoor(mode);dzi=1;dsFollow=true;dsMoved=false;dsFloor=null;dsFocus=null;IND._n=-1;compassUp=false;if(ptId)IND.startpunt={type:'IN',ptId};if(IND.modus!==mode){IND.modus=mode;if(mode==='metrolijn')stopSensors();}save();
 view='indoor';follow=false;gpsOff();document.body.classList.remove('wiz','trace','editing');
 $('fCam').onchange=e=>indoorPhoto(e.target.files[0]);$('fPick').onchange=e=>indoorPhoto(e.target.files[0]);renderIndoor();scrollTo({top:0});}
function lastText(){const H=IND.haltes;if(!H.length){const L=sens&&!sens.calib?segLen(0):null;return`Nog geen haltes. Start bij ${IND.startpunt.type==='IN'?'de invoering':'de voordeur'}.`+(L!=null?`<br><span class="note">Nu onderweg: ca. ${fmtM(L)} m sinds de start</span>`:'');}
 const h=H[H.length-1],v=h.verbinding,from=H.length>1?'halte '+(H.length-1):(IND.startpunt.type==='IN'?'invoering':'voordeur');
 let s=`<b>Laatste stuk:</b> ${from} → halte ${H.length}`;if(v.type)s+=` · ${v.type}`;if(v.lengte!=null)s+=` · ${v.lengteBron==='geschat'?'ca. ':''}${fmtM(v.lengte)} m`;if(isDoor(v)&&v.brandwerend!=null)s+=` · brandwerend ${v.brandwerend?'ja':'nee'}`;
 if(sens&&!sens.calib){const L=segLen(H.length);if(L!=null)s+=`<br><span class="note">Nu onderweg: ca. ${fmtM(L)} m sinds halte ${H.length}</span>`;}return s;}

 if(!sens)return`<div class="sbar"><span class="spst off">Spoor uit</span><button class="btn pri" id="sStart">Spoor starten</button><button class="btn" id="sCal">⚙ Kalibreren</button></div>`;
 return`<div class="sbar"><span class="spst ${sens.paused?'off':'on'}">${sens.paused?'Spoor gepauzeerd':'Spoor aan'}</span><button class="btn" id="sPause">${sens.paused?'▶ Hervat':'⏸ Pauze'}</button><button class="btn" id="sHome">Terug bij start</button><button class="btn" id="sCal">⚙</button></div>${!wl&&sens?`<p class="wakew" id="wakeW">Scherm kan uitgaan. Dan stopt het meten. <button class="btn" id="sWake">Scherm aan houden</button></p>`:''}`;}
function renderIndoor(){if(view!=='indoor')return;const prevC=$('dsw')&&$('dsw').querySelector('svg')?dsCenter():null;const n=IND.haltes.length;
 app.innerHTML=`<div class="top"><button class="back" id="iBk">‹ Buitentracé</button><br><small>${esc(cur.addr||'')}${cur.addr?' · ':''}${esc(cur.name)}</small><h1>Binnentracé</h1>
  <div class="chips"><span class="geo on"><i></i>${IND.modus==='metrolijn'?'Indoor metrolijn':'Indoor broodkruimelspoor'}</span><button class="geo" id="iMode">Modus wisselen</button></div>${sensBar()}</div>

  <span class="lab">Verdieping voor de volgende halte</span><div class="step"><button class="btn" id="fMin" aria-label="Verdieping lager">–</button><b id="fVal">${IND.floor<0?'−'+(-IND.floor):IND.floor}${IND.floor===-1?' (kelder)':''}</b><button class="btn" id="fPlus" aria-label="Verdieping hoger">+</button></div>

 <div class="ibar"><button class="btn big" id="iFoto">📷 Foto</button><button class="btn pri big" id="iHalte">Halte hier</button></div>`;

 document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>newHalte(b.dataset.room));

 on('sStart',startSpoor);on('sCal',()=>calibrate(false));on('sPause',togglePause);on('sHome',backAtStart);on('sWake',keepAwake);
 bindDs();const ch=IND.haltes.length!==IND._n;IND._n=IND.haltes.length;dsAfterRender.c=prevC;dsAfterRender(ch);}
function refreshIndoor(){if(view!=='indoor')return;const w=$('dsw'),c=dsCenter();w.innerHTML=dsSvg();$('iLast').innerHTML=lastText();const ch=IND.haltes.length!==IND._n;IND._n=IND.haltes.length;dsAfterRender.c=c;dsAfterRender(ch);}
function customRoom(){$('sheetBody').innerHTML=`<h2 style="font-size:22px">Eigen ruimtenaam</h2><label for="rn">Naam</label><input id="rn" placeholder="bv. Meterkast"><div class="row2"><button class="btn" id="rc">Annuleren</button><button class="btn pri" id="ro">Halte maken</button></div>`;
 $('sheet').hidden=false;setTimeout(()=>$('rn').focus(),50);$('rc').onclick=closeSheet;
 $('ro').onclick=()=>{const v=$('rn').value.trim();if(!v)return;const c=ls.get('roomCustom',[]);if(!c.includes(v)&&!ROOMS.includes(v)){c.push(v);ls.set('roomCustom',c);}closeSheet();newHalte(v);};}
function newHalte(type){const k=IND.haltes.length,h={id:uid(),nummer:k+1,ruimtetype:type,verdieping:IND.floor,fotos:[],notitie:'',verbinding:{type:'',lengte:null,lengteBron:'',brandwerendDichtzetten:null}};
 if(IND.modus==='broodkruimel'&&IND.spoor.some(s=>s.seg===k)){const L=segLen(k);if(L!=null){h.verbinding.lengte=r1(L);h.verbinding.lengteBron='geschat';}}
 if(sens){const p=curPos();h.anker={x:p.x,y:p.y,c:p.c||0};}
 if(type)bump('roomUse',type);dsFollow=true;dsMoved=false;dsFocus=null;dsFloor=null;IND.haltes.push(h);renum();save();renderIndoor();connSheet(k,true);}
function connSheet(i,isNew){const h=IND.haltes[i],v=h.verbinding,from=i>0?'halte '+i:(IND.startpunt.type==='IN'?'de invoering':'de voordeur');
 const draw=()=>{$('sheetBody').innerHTML=`<h2 style="font-size:22px">Hoe loopt de kabel hierheen?</h2><p class="note">Van ${from} naar halte ${i+1}${h.ruimtetype?' · '+esc(h.ruimtetype):''}</p>
  <div class="vchips">${VERB.map(t=>`<button class="btn vc" data-v="${t}" aria-pressed="${v.type===t}">${t}</button>`).join('')}</div>
  <label for="vl">Lengte in meters (mag leeg)</label><input id="vl" inputmode="decimal" value="${v.lengte!=null?fmtM(v.lengte):''}" placeholder="bv. 12">${v.lengteBron==='geschat'?'<p class="note">Geschat met het broodkruimelspoor. Pas aan als je het beter weet.</p>':''}
  ${isDoor(v)?`<span class="lab">Brandwerend dichtzetten?</span><div class="row2" style="margin-top:0"><button class="btn vc" data-b="1" aria-pressed="${v.brandwerendDichtzetten===true}">Ja</button><button class="btn vc" data-b="0" aria-pressed="${v.brandwerendDichtzetten===false}">Nee</button></div>`:''}
  <div class="row2"><button class="btn" id="vSkip">${isNew?'Overslaan':'Annuleren'}</button><button class="btn pri" id="vOk">Opslaan</button></div>`;
  $('sheet').hidden=false;
  $('sheetBody').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{keepL();v.type=v.type===b.dataset.v?'':b.dataset.v;if(!isDoor(v))v.brandwerendDichtzetten=null;draw();});
  $('sheetBody').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{keepL();v.brandwerendDichtzetten=b.dataset.b==='1';draw();});
  $('vSkip').onclick=()=>{closeSheet();save();refreshIndoor();};$('vOk').onclick=()=>{keepL();save();closeSheet();refreshIndoor();};};
 const keepL=()=>{const s=$('vl').value.trim().replace(',','.');if(s===''){if(v.lengteBron!=='geschat'){v.lengte=null;v.lengteBron='';}return;}const x=parseFloat(s);if(isFinite(x)&&x>=0&&(v.lengte==null||Math.abs(x-v.lengte)>.04)){v.lengte=x;v.lengteBron='handmatig';}};
 draw();}

function manualFit(){const M=AD.man,pd=AD.pand;let iou=null;
 if(AD.region){const ring=pd.en.map(([e,n])=>manToImg(e,n));iou=imgIou(ring,AD.region);}
 finishFit({p:{th:M.th,s:M.s},C:pd.c,toImg:manToImg},iou,true);}

/* ---------- omtrek passen ---------- */
function fitPoly(EN,R,area){const C=polyCentroid(EN),P0=EN.map(([e,n])=>[e-C[0],n-C[1]]);
 const mg=Math.round(Math.max(R.w,R.h)*.35),W2=R.w+2*mg,H2=R.h+2*mg,ox=R.x0-mg,oy=R.y0-mg,cv=document.createElement('canvas');cv.width=W2;cv.height=H2;const g=cv.getContext('2d',{willReadFrequently:true});
 const reg=new Uint8Array(W2*H2);for(let y=0;y<R.h;y++)for(let x=0;x<R.w;x++)if(R.m[y*R.w+x])reg[(y+mg)*W2+x+mg]=1;
 const toImg=(p,e,n)=>{const c=Math.cos(p.th),s=Math.sin(p.th);return[R.cx+p.dx+(c*e+s*n)/p.s,R.cy+p.dy+(s*e-c*n)/p.s];};
 const iou=p=>{g.clearRect(0,0,W2,H2);g.beginPath();P0.forEach(([e,n],i)=>{const[x,y]=toImg(p,e,n);i?g.lineTo(x-ox,y-oy):g.moveTo(x-ox,y-oy);});g.closePath();g.fillStyle='#000';g.fill();
  const d=g.getImageData(0,0,W2,H2).data;let I=0,U=0;for(let k=0;k<W2*H2;k++){const a=d[k*4+3]>127,b=reg[k];if(a&&b)I++;if(a||b)U++;}return U?I/U:0;};
 let best={th:0,s:Math.sqrt(area/R.N),dx:0,dy:0},bi=-1;for(let a=0;a<360;a+=3){const p={...best,th:a*Math.PI/180},v=iou(p);if(v>bi){bi=v;best=p;}}
 const D=Math.PI/180,steps=[['th',D],['th',.25*D],['s',.01],['dx',2],['dy',2],['dx',.5],['dy',.5]];let it=0,imp=true;
 while(imp&&it++<80){imp=false;for(const[k,st]of steps)for(const sg of[1,-1]){const p={...best};if(k==='s')p.s*=1+sg*st;else p[k]+=sg*st;const v=iou(p);if(v>bi+1e-5){bi=v;best=p;imp=true;}}}
 const f=R.f||1;return{p:{...best,s:best.s*f},iou:bi,C,toImg:(e,n)=>toImg(best,e-C[0],n-C[1]).map(v=>v/f)};}
function runFit(){const R=AD.region,pd=AD.pand;if(!R)return;const F=fitPoly(pd.en,R,pd.area);finishFit(F,F.iou,false);}
function finishFit(F,iou,manual){const pd=AD.pand,la0=AD.lat,lo0=AD.lon,cl=Math.cos(la0*Math.PI/180),toLL=(e,n)=>[la0+n/110540,lo0+e/(cl*111320)];
 const vA=[F.C[0],F.C[1]],vB=[F.C[0]+50,F.C[1]],v=[vA,vB].map(([e,n])=>{const[x,y]=F.toImg(e,n),[la,lo]=toLL(e,n);return{x,y,la,lo};});
 let nb=null;const N1=AD.nbs.find(q=>Math.hypot(q.c[0]-pd.c[0],q.c[1]-pd.c[1])<120);
 if(N1){const pc=F.toImg(N1.c[0],N1.c[1]),RN=manual?null:regionAt(gMask,pc[0],pc[1]);if(RN){const ring=N1.en.map(([e,n])=>F.toImg(e,n));nb={iou:imgIou(ring,RN),id:N1.id};}else nb={iou:null,id:N1.id};}
 let deg=(F.p.th*180/Math.PI)%360;if(deg<0)deg+=360;
 addrPick=false;addrManual=false;addrOverlay=null;document.body.classList.remove('wiz');setBig(false);if(pausedTrace){pausedTrace=false;}
 cur.addrFit={v,iou,manual,scale:F.p.s,rot:deg,nbIou:nb?nb.iou:null,ring:pd.ring,nbRing:N1?N1.ring:null,label:AD.label,area:Math.round(pd.area),pandId:pd.id,at:Date.now()};
 solve();drawAll();addrResult();}
function imgIou(ring,R){ring=ring.map(([x,y])=>[x*(R.f||1),y*(R.f||1)]);const mg=10,W2=R.w+2*mg,H2=R.h+2*mg,cv=document.createElement('canvas');cv.width=W2;cv.height=H2;const g=cv.getContext('2d');g.beginPath();ring.forEach(([x,y],i)=>{i?g.lineTo(x-R.x0+mg,y-R.y0+mg):g.moveTo(x-R.x0+mg,y-R.y0+mg);});g.closePath();g.fill();
 const d=g.getImageData(0,0,W2,H2).data;let I=0,U=0,out=0;ring.forEach(([x,y])=>{if(x<R.x0-mg||y<R.y0-mg||x>R.x0+R.w+mg||y>R.y0+R.h+mg)out++;});
 for(let y=0;y<H2;y++)for(let x=0;x<W2;x++){const a=d[(y*W2+x)*4+3]>127,yy=y-mg,xx=x-mg,b=xx>=0&&yy>=0&&xx<R.w&&yy<R.h&&R.m[yy*R.w+xx];if(a&&b)I++;if(a||b)U++;}return out>ring.length/3?0:U?I/U:0;}
const pct=v=>v==null?'–':Math.round(v*100)+'%';
function addrResult(){const A=cur.addrFit;if(!A)return;
 $('sheetBody').innerHTML=`<h2 style="font-size:22px">Gekoppeld via adres</h2><p class="note">${esc(A.label)}</p>
 <div class="kv"><span>Overlap met de BAG-omtrek</span><b class="${A.iou!=null&&A.iou<.85?'warn':'ok'}">${A.manual&&A.iou==null?'zelf gepast':pct(A.iou)}</b><span>Schaal</span><b>1 px ≈ ${A.scale.toFixed(3).replace('.',',')} m</b><span>Draaiing</span><b>${Math.round(A.rot)}°</b><span>Controle buurpand</span><b>${A.nbIou==null?(A.manual?'zelf te controleren (stippellijn)':A.nbRing?'niet gevonden op de tekening':'geen buurpand'):'overlap '+pct(A.nbIou)}</b></div>
 ${A.iou!=null&&A.iou<.85?`<p class="warn">Heb je het juiste pand aangewezen?</p>`:''}${A.manual?'<p class="note">Zelf gepast: controleer de koppeling ter plekke met één gps-anker (Ter plekke met gps → Alleen dit anker).</p>':''}<p class="note">De BAG-omtrek staat blauw gestippeld op de tekening, het buurpand dunner gestippeld.</p>
 <div class="row2"><button class="btn" id="arRe">Opnieuw aanwijzen</button><button class="btn pri" id="arOk">Klopt</button></div>`;$('sheet').hidden=false;
 $('arRe').onclick=()=>{if(!AD||!AD.pand){closeSheet();addrForm();return;}cur.addrFit=null;solve();closeSheet();startPick();};
 $('arOk').onclick=()=>{save();closeSheet();drawAll();setNav('alles');if(!cur.pts.length)startTrace();toast(A.iou==null?'Gekoppeld via adres (zelf gepast)':`Gekoppeld via adres · overlap ${pct(A.iou)}`);};}
function addrDev(){const a=cur.anchors.find(q=>q.la!=null);if(!a||!cur.addrFit)return null;const V=cur.addrFit.v,la0=V[0].la,lo0=V[0].lo,cl=Math.cos(la0*Math.PI/180),toEN=(la,lo)=>[(lo-lo0)*cl*111320,(la-la0)*110540];
 const Q=V.map(q=>({a:[q.x,-q.y],b:toEN(q.la,q.lo)})),m=cd([Q[1].b[0]-Q[0].b[0],Q[1].b[1]-Q[0].b[1]],[Q[1].a[0]-Q[0].a[0],Q[1].a[1]-Q[0].a[1]]),z=cm(m,Q[0].a),t=[Q[0].b[0]-z[0],Q[0].b[1]-z[1]],p=cm(m,[a.x,-a.y]),e=[p[0]+t[0],p[1]+t[1]],g=toEN(a.la,a.lo);
 return Math.hypot(e[0]-g[0],e[1]-g[1]);}

function docRows(){const d=cur.doc||{};return[['Projectnummer',d.projectnummer],['Eigenaar',d.eigenaar||(d.eigenaarIsKlant===false?'niet de klant':'')],['Contactpersoon',d.contactpersoon],['Telefoon',d.telefoon],['E-mail',d.email],['Afwerkpunt',[d.ruimte,d.kast].filter(Boolean).join(' / ')],['Eindpunt route',d.kast]].filter(r=>r[1]);}
function docTable(){if(!cur.doc)return'';return`<h2>Algemene gegevens</h2><table>${docRows().map(([k,v])=>`<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join('')}</table>`;}
/* ---------- project-instellingen ---------- */
function projSheet(){const b=$('sheetBody'),n=cur.pts.filter(p=>p.photo).length;
 b.innerHTML=`<h2 style="font-size:22px">Project</h2><label for="pn">Naam / adres</label><input id="pn" value="${esc(cur.name)}"><label for="pa">Plaats / gebouw</label><input id="pa" value="${esc(cur.addr)}"><label for="ps">Projectnummer</label><input id="ps" value="${esc(cur.sid)}">
 <div class="row2"><button class="btn dk" id="pSave">Opslaan</button></div>
 <span class="lab">Route</span><div class="row2" style="margin-top:0"><button class="btn" id="reTr">Route opnieuw trekken</button></div><span class="lab">Weergave</span><div class="row2" style="margin-top:0"><button class="btn" id="conP" aria-pressed="${contrast}">Contrastmodus voor fel zonlicht: ${contrast?'aan':'uit'}</button></div><span class="lab">SISU-document</span>${cur.doc?`<div class="kv">${docRows().map(([k,v])=>`<span>${k}</span><b>${esc(v)}</b>`).join('')}</div>`:'<p class="note">Nog niet ingelezen.</p>'}<div class="row2" style="margin-top:6px"><label class="btn" style="margin:0;color:var(--ink)">SISU-document inlezen<input type="file" id="psDoc" accept="application/pdf"></label></div><span class="lab">Foto's en opruimen</span><div class="row2" style="margin-top:0"><button class="btn" id="shP" ${n?'':'disabled'}>Foto's bewaren op telefoon</button><button class="btn" id="arcP">Archiveren</button></div><div class="row2"><button class="btn red" id="wipe" ${n?'':'disabled'}>${n} foto's wissen</button><button class="btn red" id="delP">Project verwijderen</button></div><p class="note" id="conf"></p>`;
 $('sheet').hidden=false;
 confirmTwice0($('reTr'),cur.pts.some(p=>p.photo||p.it)?'Punten met foto of item gaan verloren.':'',()=>{closeSheet();push();cur.pts.forEach(p=>p.photo&&delBlob(p.photo));cur.pts=[];save();startTrace();});
 $('conP').onclick=()=>{toggleContrast();closeSheet();};
 $('psDoc').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=await readSisu(f);applyDoc(cur,Object.assign({},cur.doc||{},d,{codePos:(cur.doc||{}).codePos}));save();projSheet();toast('SISU-document ingelezen');}catch(err){toast('Het document kon niet worden gelezen.');}};
 $('pSave').onclick=()=>{cur.name=$('pn').value.trim()||cur.name;cur.addr=$('pa').value.trim();cur.sid=$('ps').value.trim();save();closeSheet();drawHead();};
 const confirmTwice=(btn,msg,fn)=>{let armed=false;btn.onclick=()=>{if(!armed){armed=true;btn.textContent='Zeker? Tik nog een keer';$('conf').textContent=msg;return;}fn();};};
 confirmTwice($('wipe'),'Maak eerst het rapport als PDF. Daarna zijn de foto\'s weg.',async()=>{for(const p of cur.pts)if(p.photo){await delBlob(p.photo);p.photo='';}if(cur.indoor)for(const h of cur.indoor.haltes){for(const k of h.fotos)await delBlob(k);h.fotos=[];}await putProj(cur);closeSheet();drawAll();});
 confirmTwice($('delP'),'Tekening, punten en foto\'s worden uit de app gewist. Foto\'s uit je galerij blijven daar staan.',async()=>{await deleteProject(cur);closeSheet();home();});
 $('shP').onclick=()=>sharePhotos(cur);$('arcP').onclick=async()=>{cur.archived=true;await putProj(cur);closeSheet();toast('Gearchiveerd');home();};}

/* ---------- rapport ---------- */
function report(){view='rep';gpsOff();const M=meters(),N=nums(),s=cur.W/700;
 const bs=T&&BASES[cur.base]?baseSvg(700):null;const mapSvg=`<svg viewBox="0 0 ${cur.W} ${cur.H}">${bs?bs.html:''}<image href="${drawUrl}" width="${cur.W}" height="${cur.H}" opacity="${bs?(cur.drawOp??.55):1}"/>${cur.pts.length>1?`<polyline points="${cur.pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${OR}" stroke-width="${3*s}" stroke-opacity=".6"/>`:''}${cur.pts.map(p=>sym(p.it,p.x,p.y,s*1.4,N[p.id])).join('')}</svg>`;
 const inv=cur.pts.findIndex(p=>p.it==='inv'||p.it==='brw');
 app.innerHTML=`<div class="tool noprint"><button class="btn" id="rb">‹ Terug</button><span class="sp"></span><button class="btn pri" id="pr">Afdrukken / PDF</button></div>
 <div class="rep"><h1 style="font-size:28px">${esc(cur.name)}</h1><p class="note">${esc(cur.sid)} · ${esc(cur.addr)} · ${new Date().toLocaleDateString('nl-NL')}</p>${docTable()}
 <table><tr><td>Lengte route</td><td class="n">${M?Math.round(M[M.length-1])+' m':'niet gekoppeld'}</td></tr>${inv>0&&M?`<tr><td>Buitentracé tot invoering</td><td class="n">${Math.round(M[inv])} m</td></tr>`:''}<tr><td>Punten / foto's</td><td class="n">${keyPts().length} / ${Object.keys(N).length}</td></tr><tr><td>Gps-koppeling</td><td class="n">${T&&T.via==='adres'?`via adres, overlap ${pct(cur.addrFit.iou)}`:T?`${cur.anchors.length} ankers${T.err.length?`, afwijking ${T.err.map(e=>e.toFixed(1)).join('/')} m`:''}`:'geen'}</td></tr></table>
 <h2>Tracé</h2><div class="mapc">${mapSvg}</div>${bs?`<p class="note">${BASES[cur.base].attr}</p>`:''}
 <h2>Punten</h2><table><tr><th>#</th><th>Item</th><th>Omschrijving</th><th class="n">m</th></tr>${keyPts().map(({p,i},n)=>`<tr><td>${n+1}</td><td>${label(p)}${N[p.id]?` · foto ${N[p.id]}`:''}</td><td>${esc(p.c)}</td><td class="n">${M?Math.round(M[i]):''}</td></tr>`).join('')}</table>
 <h2>Foto's</h2><div class="pgrid">${cur.pts.filter(p=>p.photo&&urls[p.photo]).map(p=>`<figure>${photoHtml(p)}<figcaption><b>Foto ${N[p.id]}</b> · ${esc(p.c||label(p))}</figcaption></figure>`).join('')||'<p class="note">Geen foto\'s.</p>'}</div>${indoorReport()}</div>`;
 $('rb').onclick=()=>openProject(cur.id);$('pr').onclick=()=>window.print();}

window.addEventListener('error',e=>{try{toast('Er ging iets mis: '+(e.message||'onbekende fout'));}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{toast('Er ging iets mis: '+((e.reason&&e.reason.message)||e.reason||'onbekende fout'));}catch(_){}});
init();
}
</script>
