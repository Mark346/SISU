<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schouw</title>
<meta name="theme-color" content="#1d2529">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#e9ebe8;--card:#fff;--ink:#151a1d;--mute:#5d676c;--line:#d9ddda;--asf:#1d2529;--hv:#ff6a13;--hv2:#c24a00;--ok:#1f7a4a;--bad:#b3261e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Semi Condensed",Barlow,sans-serif;line-height:1.1;margin:0}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--card)}
.top{background:var(--asf);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:relative}
.top small{color:#b8c2c6;font-size:13px}.top h1{font-size:23px;margin:2px 0 8px}
.back{background:none;border:0;color:#b8c2c6;font:600 15px Barlow,sans-serif;padding:6px 0;min-height:36px;cursor:pointer}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#b8c2c6}.stats b{display:block;color:#fff;font:700 21px "Barlow Semi Condensed",sans-serif}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.geo{display:inline-flex;gap:6px;align-items:center;font:500 14px Barlow,sans-serif;border-radius:20px;padding:4px 11px;background:#ffffff1f;color:#fff;border:0;cursor:pointer;min-height:36px}
.geo i{width:9px;height:9px;border-radius:50%;background:#ffb357}.geo.on i{background:#5fd39a}.geo.err i{background:#ff6b6b}
.tool{display:flex;gap:5px;padding:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:3}
.btn{font:600 14px Barlow,system-ui,sans-serif;border-radius:9px;padding:8px 11px;min-height:42px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--hv);border-color:var(--hv);color:#fff}.btn.dk,.btn[aria-pressed=true]{background:var(--asf);border-color:var(--asf);color:#fff}
.btn.red{color:var(--bad);border-color:#e7b9b5}.btn:disabled{opacity:.45;cursor:default}.sp{flex:1}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:3px solid var(--hv);outline-offset:2px}
.modeTip{background:var(--asf);color:#fff;font-size:14px;padding:8px 12px}
.mapS{overflow:auto;max-height:62vh;background:#cfd3d1;overscroll-behavior:contain}
.mapI{width:100%}
#svg{display:block;width:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mk{cursor:grab;touch-action:none}
.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 8px 20px -6px #0007;min-height:54px;padding:0 18px;font-size:16px;border-radius:28px}
.sec{padding:14px 16px}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;font-size:12.5px;line-height:1.25;color:var(--mute)}
.legend svg{display:block;margin:0 auto 4px;width:44px;height:36px}
.rule{font-size:14px;margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#fff1e6}.rule b{color:var(--hv2)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.row svg{width:40px;height:34px}.row .t{font-weight:600;font-size:15px;line-height:1.25}.row .d{font-size:13px;color:var(--mute)}
.th{width:64px;height:48px;border-radius:6px;overflow:hidden;background:var(--bg);display:grid;place-items:center;font-size:11px;color:var(--mute);text-align:center}.th img{width:100%;height:100%;object-fit:cover}
.proj{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.proj .th{width:72px;height:72px}.proj b{display:block;font-size:17px;line-height:1.2}.proj span{font-size:13px;color:var(--mute)}
.sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet[hidden]{display:none}
.sheet>div{background:var(--card);width:min(560px,100%);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sh-h{display:flex;gap:12px;align-items:center}.sh-h svg{width:64px;height:52px;flex:none}
label,.lab{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input,select{width:100%;font:16px Barlow,system-ui,sans-serif;padding:10px;border-radius:9px;border:1px solid var(--line);background:#f6f7f6;color:var(--ink)}
input[type=file]{display:none}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.it{display:flex;gap:8px;align-items:center;text-align:left;font:500 14px Barlow,system-ui,sans-serif;line-height:1.2;padding:6px 8px;min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.it svg{width:30px;height:26px;flex:none}.it[aria-pressed=true]{border-color:var(--hv);box-shadow:inset 0 0 0 2px var(--hv)}
.grp{font-size:12px;color:var(--mute);margin:10px 0 2px;grid-column:1/-1}
.ph{display:flex;gap:10px;align-items:center}.ph .th{width:110px;height:82px;flex:none}.ph .col{display:grid;gap:6px;flex:1}
.row2{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.row2 .btn{flex:1}
.meth{display:grid;gap:8px}.meth .btn{text-align:left;display:block;width:100%}.meth small{display:block;font-weight:400;color:var(--mute);font-size:13px;margin-top:2px}
.anc{font-size:14px;padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.ok{color:var(--ok);font-weight:600}.warn{color:var(--bad)}
.note{font-size:13px;color:var(--mute)}
.pages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pages button{border:1px solid var(--line);background:#fff;padding:4px;border-radius:8px;cursor:pointer;font:12px Barlow,sans-serif}.pages img{width:100%;display:block}
.big{font:700 28px "Barlow Semi Condensed",sans-serif}
/* rapport */
.rep{padding:16px}.rep h2{font-size:22px;border-bottom:2px solid var(--hv);padding-bottom:4px;margin:18px 0 8px}
.rep table{width:100%;border-collapse:collapse;font-size:14px}.rep td,.rep th{padding:6px 4px;border-bottom:1px solid #e3e3e3;text-align:left;vertical-align:top}.rep td.n{text-align:right;white-space:nowrap}
.rep .pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.rep figure{margin:0;break-inside:avoid}.rep figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block}.rep figcaption{font-size:13px;margin-top:4px}
.rep .mapc svg{width:100%;display:block;border:1px solid #ddd}
@media print{.noprint,.tool,.top,.fab{display:none!important}.app{max-width:none}.rep{padding:0}body{background:#fff}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet" id="sheet" hidden><div id="sheetBody"></div></div>
<input type="file" id="fPick" accept="image/*">
<input type="file" id="fCam" accept="image/*" capture="environment">
<input type="file" id="fDraw" accept="image/*,application/pdf">
<script>
{
const BR='#943a22',GR='#3bdc5a',TE='#0d7380',YE='#ffe600',OR='#ff6a13';
const ITEMS={hh_n:{l:'Nieuwe handhole',sh:'sq',f:BR,s:GR,g:'Nieuw'},kp_n:{l:'Nieuwe koppeling',sh:'ci',f:BR,s:GR,g:'Nieuw'},
 inv:{l:'Invoering (gat boren)',sh:'ci',f:BR,s:GR,t:'IN',g:'Nieuw'},brw:{l:'Invoer brandwerend',sh:'ci',f:BR,s:GR,dash:1,g:'Nieuw'},
 gmb:{l:'Boring met mantelbuis',sh:'ci',f:BR,s:GR,t:'GmB',g:'Boring / persing'},gzb:{l:'Boring zonder buis',sh:'ci',f:BR,s:GR,t:'GzB',g:'Boring / persing'},
 per:{l:'Persing',sh:'ci',f:BR,s:GR,t:'P',g:'Boring / persing'},lmb:{l:'Leggen mantelbuis',sh:'ci',f:BR,s:GR,t:'L',g:'Boring / persing'},bb:{l:'Boogboring',sh:'ci',f:BR,s:GR,t:'BB',g:'Boring / persing'},
 hh_b:{l:'Bestaande handhole',sh:'sq',f:TE,s:YE,g:'Bestaand'},kp_b:{l:'Bestaande koppeling',sh:'ci',f:TE,s:YE,g:'Bestaand'},
 srv:{l:'Serverkast',sh:'rc',f:'#fff',s:GR,g:'Binnen'},fdb:{l:'FDB lasbox',sh:'rc',f:BR,s:GR,t:'FDB',g:'Binnen'}};
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- opslag (IndexedDB) ---------- */
let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('schouw',1);r.onupgradeneeded=()=>{r.result.createObjectStore('projects',{keyPath:'id'});r.result.createObjectStore('blobs');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const st=(store,mode,fn)=>new Promise((res,rej)=>{const t=db.transaction(store,mode),q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
const getAll=()=>st('projects','readonly',s=>s.getAll());
const putProj=p=>{p.updated=Date.now();return st('projects','readwrite',s=>s.put(p));};
const delProj=id=>st('projects','readwrite',s=>s.delete(id));
const putBlob=(k,b)=>st('blobs','readwrite',s=>s.put(b,k));
const getBlob=k=>st('blobs','readonly',s=>s.get(k));
const delBlob=k=>st('blobs','readwrite',s=>s.delete(k));
const urls={};
async function url(k){if(!k)return'';if(!urls[k]){const b=await getBlob(k);urls[k]=b?URL.createObjectURL(b):'';}return urls[k];}
async function shrink(file,max=1600){const img=await loadImg(URL.createObjectURL(file));const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);return new Promise(r=>c.toBlob(r,'image/jpeg',.82));}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
let saveT=null;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>putProj(cur),300);};

/* ---------- symbolen ---------- */
function sym(it,cx,cy,s,num){let o='';const I=ITEMS[it],r=10*s;
 if(!I){if(num)o+=`<circle cx="${cx}" cy="${cy}" r="${11*s}" fill="#fff" stroke="${OR}" stroke-width="${3.2*s}"/><text x="${cx}" y="${cy+4*s}" font-size="${11.5*s}" font-weight="700" text-anchor="middle" fill="#1b1b1b" font-family="Barlow,sans-serif">${num}</text>`;
  else o+=`<circle cx="${cx}" cy="${cy}" r="${5*s}" fill="#fff" stroke="#1b1b1b" stroke-width="${1.8*s}"/>`;return o;}
 const sw=2.4*s;
 if(I.sh==='sq')o+=`<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" fill="${I.f}" stroke="${I.s}" stroke-width="${sw}"/>`;
 else if(I.sh==='rc')o+=`<rect x="${cx-r*.8}" y="${cy-r*1.15}" width="${1.6*r}" height="${2.3*r}" fill="${I.f}" stroke="${I.s}" stroke-width="${sw}"/>`;
 else o+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${I.f}" stroke="${I.s}" stroke-width="${sw}" ${I.dash?`stroke-dasharray="${2*s} ${1.5*s}"`:''}/>`;
 if(I.t)o+=`<text x="${cx}" y="${cy+(I.t.length>2?3:4)*s}" font-size="${(I.t.length>2?7.5:11)*s}" font-weight="700" text-anchor="middle" fill="#fff" font-family="Barlow,sans-serif">${I.t}</text>`;
 if(num)o+=`<circle cx="${cx+r*.95}" cy="${cy-r*.95}" r="${7.5*s}" fill="${OR}" stroke="#fff" stroke-width="${1.6*s}"/><text x="${cx+r*.95}" y="${cy-r*.95+3.3*s}" font-size="${9.5*s}" font-weight="700" text-anchor="middle" fill="#fff" font-family="Barlow,sans-serif">${num}</text>`;
 return o;}
const icon=(it,num,w=40,h=34)=>`<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${sym(it,w/2-(ITEMS[it]&&num?3:0),h/2+(ITEMS[it]&&num?3:0),1,num)}</svg>`;
const label=p=>ITEMS[p.it]?.l||(p.photo?'Fotopunt':'Routepunt');

/* ---------- geometrie & gps ---------- */
const cm=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],cd=(a,b)=>{const q=b[0]**2+b[1]**2;return[(a[0]*b[0]+a[1]*b[1])/q,(a[1]*b[0]-a[0]*b[1])/q];};
let T=null;
function solve(){const A=cur.anchors.filter(a=>cur.pts.some(p=>p.id===a.id));if(A.length<2){T=null;return;}
 const la0=A[0].la,lo0=A[0].lo,cl=Math.cos(la0*Math.PI/180),toEN=(la,lo)=>[(lo-lo0)*cl*111320,(la-la0)*110540];
 const Q=A.map(a=>{const p=cur.pts.find(q=>q.id===a.id);return{a:[p.x,-p.y],b:toEN(a.la,a.lo)};});
 const m=cd([Q[1].b[0]-Q[0].b[0],Q[1].b[1]-Q[0].b[1]],[Q[1].a[0]-Q[0].a[0],Q[1].a[1]-Q[0].a[1]]);
 if(!isFinite(m[0])){T=null;return;}const z=cm(m,Q[0].a),t=[Q[0].b[0]-z[0],Q[0].b[1]-z[1]];
 T={m,t,scale:Math.hypot(...m),rot:Math.atan2(m[1],m[0])*180/Math.PI,toEN,
  toLL:(e,n)=>[la0+n/110540,lo0+e/(cl*111320)],
  err:Q.slice(2).map(q=>{const w=cm(m,q.a);return Math.hypot(w[0]+t[0]-q.b[0],w[1]+t[1]-q.b[1]);})};}
const img2ll=(x,y)=>{const z=cm(T.m,[x,-y]);return T.toLL(z[0]+T.t[0],z[1]+T.t[1]);};
const ll2img=(la,lo)=>{const[e,n]=T.toEN(la,lo),a=cd([e-T.t[0],n-T.t[1]],T.m);return[a[0],-a[1]];};
const len=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function meters(){if(!T)return null;let s=0;const o=[0];for(let i=1;i<cur.pts.length;i++){s+=len(cur.pts[i-1],cur.pts[i])*T.scale;o.push(s);}return o;}
let gps=null,watch=null,gpsErr='',gpsListeners=[];
function gpsOn(){if(watch!==null)return;if(!navigator.geolocation){gpsErr='Deze browser heeft geen gps';return;}
 watch=navigator.geolocation.watchPosition(p=>{gps={la:p.coords.latitude,lo:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};gpsErr='';gpsListeners.forEach(f=>f(gps));if(view==='proj'){drawHead();drawMap();}},
  e=>{gpsErr=e.code===1?'Geen toestemming voor locatie. Zet locatie aan voor deze site in je instellingen.':'Gps niet beschikbaar ('+e.message+')';gpsListeners.forEach(f=>f(null));if(view==='proj')drawHead();},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});}
function gpsOff(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;gps=null;}

/* ---------- toestand ---------- */
let view='home',cur=null,drawUrl='',mask=null,sel=null,addMode=false,snap=true,zoom=1,follow=false,hist=[],placeHere=false;
const push=()=>{hist.push(JSON.stringify(cur.pts));hist.length>50&&hist.shift();};
function nums(){let n=0;const m={};cur.pts.forEach(p=>{if(p.photo)m[p.id]=++n;});return m;}

/* ---------- start ---------- */
async function init(){try{db=await openDB();}catch(e){app.innerHTML='<p class="sec warn">Opslag niet beschikbaar in deze browser (privémodus?).</p>';return;}
 navigator.storage?.persist?.();
 const all=await getAll();if(!all.length&&!localStorage.getItem('demoMade')){await makeDemo();localStorage.setItem('demoMade','1');}
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
 home();}
async function makeDemo(){try{const b=await (await fetch('voorbeeld-tekening.jpg')).blob();const k='d_'+uid();await putBlob(k,b);
 const pts=[[400,466,'hh_n','Nieuw te leggen DB7 vanuit nieuwe handhole uit ander project.'],[349,416,'','Nieuw te leggen DB7.'],[319,390,'',''],[271,345,'','Nieuw te leggen DB7.'],[234,297,'',''],[200,249,'','Nieuw te leggen DB7.'],[163,200,'','Nieuw te leggen DB7.'],[143,170,'',''],[124,179,'kp_n','Nieuw te leggen DB7 en nieuw te plaatsen buiskoppeling en nieuw te leggen DB2.'],[96,188,'inv','Nieuw te leggen DB2 en hier komt de invoering door middel van een gat te boren.'],[54,173,'srv','Nieuw te plaatsen ODF-lade op hoogte 1 HE.']].map(a=>({id:uid(),x:a[0],y:a[1],it:a[2],c:a[3],photo:''}));
 await putProj({id:uid(),name:'Voorbeeld – Opaallaan 372',addr:'Hoofddorp · HFD0388',sid:'SID000892476',draw:k,W:429,H:640,pts,anchors:[],created:Date.now()});}catch(e){}}

/* ---------- home ---------- */
async function home(){view='home';cur=null;gpsOff();hist=[];
 const all=(await getAll()).sort((a,b)=>b.updated-a.updated);const th=await Promise.all(all.map(p=>url(p.draw)));
 app.innerHTML=`<div class="top"><small>Schouw · veldtest</small><h1>Projecten</h1></div>
 <div class="sec"><button class="btn pri" id="newP" style="width:100%">+ Nieuw project</button>
 ${all.map((p,i)=>`<div class="proj" data-p="${p.id}"><div class="th">${th[i]?`<img src="${th[i]}" alt="">`:''}</div><div><b>${esc(p.name)}</b><span>${esc(p.addr)} · ${p.pts.length} punten · ${p.pts.filter(q=>q.photo).length} foto's · ${new Date(p.updated).toLocaleDateString('nl-NL')}</span></div></div>`).join('')||'<p class="note">Nog geen projecten.</p>'}
 <p class="note" style="margin-top:20px">Alles wordt alleen op deze telefoon bewaard. Tip: zet de app op je beginscherm via Delen → "Zet op beginscherm".</p></div>`;
 $('newP').onclick=newProject;app.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>openProject(e.dataset.p));}
function newProject(){let draw=null;
 const body=$('sheetBody');body.innerHTML=`<h2 style="font-size:22px">Nieuw project</h2>
 <label for="pn">Naam / adres</label><input id="pn" placeholder="bv. Opaallaan 372"><label for="pa">Plaats / gebouw</label><input id="pa" placeholder="bv. Hoofddorp · HFD0388"><label for="ps">Projectnummer (optioneel)</label><input id="ps">
 <span class="lab">Tekening</span><div class="ph"><div class="th" id="dTh">geen</div><div class="col"><label class="btn" for="fDraw" style="margin:0;color:var(--ink)">Foto, screenshot of PDF kiezen</label><span class="note" id="dNote">Een screenshot van alleen de kaart werkt het best.</span></div></div>
 <div id="pdfPages"></div>
 <div class="row2"><button class="btn" id="pc">Annuleren</button><button class="btn pri" id="pok">Aanmaken</button></div>`;
 $('sheet').hidden=false;$('pc').onclick=closeSheet;
 $('fDraw').value='';$('fDraw').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  if(f.type==='application/pdf'){$('dNote').textContent='PDF laden…';try{await pickPdfPage(f,b=>{draw=b;showDraw(b);});}catch(err){$('dNote').textContent='PDF kon niet worden gelezen.';}}
  else{draw=await shrink(f,2400);showDraw(draw);}};
 function showDraw(b){$('dTh').innerHTML=`<img src="${URL.createObjectURL(b)}" alt="">`;$('dNote').textContent='Tekening gekozen.';$('pdfPages').innerHTML='';}
 $('pok').onclick=async()=>{const name=$('pn').value.trim()||'Nieuw project';if(!draw){$('dNote').innerHTML='<span class="warn">Kies eerst een tekening.</span>';return;}
  const k='d_'+uid();await putBlob(k,draw);const im=await loadImg(URL.createObjectURL(draw));
  const p={id:uid(),name,addr:$('pa').value.trim(),sid:$('ps').value.trim(),draw:k,W:im.naturalWidth,H:im.naturalHeight,pts:[],anchors:[],created:Date.now()};await putProj(p);closeSheet();openProject(p.id);};}
let pdfjs=null;
async function pickPdfPage(file,done){
 if(!pdfjs){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});pdfjs=window.pdfjsLib;pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
 const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;const box=$('pdfPages');

/* ---------- rapport ---------- */
function report(){view='rep';gpsOff();const M=meters(),N=nums(),s=cur.W/700;
 const mapSvg=`<svg viewBox="0 0 ${cur.W} ${cur.H}"><image href="${drawUrl}" width="${cur.W}" height="${cur.H}"/>${cur.pts.length>1?`<polyline points="${cur.pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${OR}" stroke-width="${3*s}" stroke-opacity=".6"/>`:''}${cur.pts.map(p=>sym(p.it,p.x,p.y,s*1.4,N[p.id])).join('')}</svg>`;
 const inv=cur.pts.findIndex(p=>p.it==='inv'||p.it==='brw');
 app.innerHTML=`<div class="tool noprint"><button class="btn" id="rb">‹ Terug</button><span class="sp"></span><button class="btn pri" id="pr">Afdrukken / PDF</button></div>
 <div class="rep"><h1 style="font-size:28px">${esc(cur.name)}</h1><p class="note">${esc(cur.sid)} · ${esc(cur.addr)} · ${new Date().toLocaleDateString('nl-NL')}</p>
 <table><tr><td>Lengte route</td><td class="n">${M?Math.round(M[M.length-1])+' m':'niet gekoppeld'}</td></tr>${inv>0&&M?`<tr><td>Buitentracé tot invoering</td><td class="n">${Math.round(M[inv])} m</td></tr>`:''}<tr><td>Punten / foto's</td><td class="n">${cur.pts.length} / ${Object.keys(N).length}</td></tr><tr><td>Gps-koppeling</td><td class="n">${T?`${cur.anchors.length} ankers${T.err.length?`, afwijking ${T.err.map(e=>e.toFixed(1)).join('/')} m`:''}`:'geen'}</td></tr></table>
 <h2>Tracé</h2><div class="mapc">${mapSvg}</div>
 <h2>Punten</h2><table><tr><th>#</th><th>Item</th><th>Omschrijving</th><th class="n">m</th></tr>${cur.pts.map((p,i)=>`<tr><td>${i+1}</td><td>${label(p)}${N[p.id]?` · foto ${N[p.id]}`:''}</td><td>${esc(p.c)}</td><td class="n">${M?Math.round(M[i]):''}</td></tr>`).join('')}</table>
 <h2>Foto's</h2><div class="pgrid">${cur.pts.filter(p=>p.photo&&urls[p.photo]).map(p=>`<figure><img src="${urls[p.photo]}" alt=""><figcaption><b>Foto ${N[p.id]}</b> · ${esc(p.c||label(p))}</figcaption></figure>`).join('')||'<p class="note">Geen foto\'s.</p>'}</div></div>`;
 $('rb').onclick=()=>openProject(cur.id);$('pr').onclick=()=>window.print();}

init();
}
</script>
</body>
</html>
