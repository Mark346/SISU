<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f12">
<title>Sisu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="shared/base.css">

</head>
<body>
<header class="bar"><button class="back" id="hb" hidden>‹ Schouwen</button><h1 id="ttl">Sisu</h1></header>
<main class="page" id="main"></main>
<script src="shared/store.js"></script>
<script src="shared/legend.js"></script>
<script src="shared/camera.js"></script>
<script src="shared/editor.js"></script>
<script src="shared/pdfdoc.js"></script>
<script src="shared/survey-ui.js"></script>
<script>
/* Veeg & Klik: foto maken, route vegen, editor uit shared/editor.js */
function newPhoto(survey,galerij){
  Camera.take({galerij}).then(async r=>{
    if(!r||!r.blob)return;
    const p=await Store.photos.put({surveyId:survey.id,blob:r.blob,ann:{orient:r.orient||'liggend'},bron:'veeg',status:'ok'});
    edit(survey,p.id);
  }).catch(()=>SurveyUI.toast('Foto maken lukte niet'));
}
function edit(survey,id){
  Editor.openEditor(id,{
    onClose:()=>SurveyUI.show(survey),
    onChange:()=>SurveyUI.recount(),
    onNext:()=>{Editor.close();newPhoto(survey,false);},
    onDoc:()=>{location.href='shared/storyline.html?survey='+encodeURIComponent(survey.id);}
  }).catch(e=>SurveyUI.toast('Kon de foto niet openen: '+(e.message||e)));
}
SurveyUI.init({
  variant:'veeg',naam:'Veeg & Klik',startTitel:'Sisu · Veeg & Klik',metersZelf:true,
  startExtra:'<div class="row" style="margin-top:40px"><a class="btn" href="opties.html" style="flex:1">Andere opties</a></div>',
  onScreen:w=>{const b=document.getElementById("hb");b.hidden=w==="start";b.onclick=()=>SurveyUI.start();},
  invoerUitleg:"Telt de app: IN-symbolen op geldige foto's.",
  acties:(s,n)=>[{label:`Foto ${n+1} maken`,pri:1,fn:s=>newPhoto(s,false)},{label:'Foto uit galerij',fn:s=>newPhoto(s,true)}],
  tellen:(s,ph)=>({invoeringen:ph.reduce((n,p)=>n+(((p.ann&&p.ann.syms)||[]).filter(x=>x.t==='dv').length),0)}),
  openFoto:(s,id)=>edit(s,id)
});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
