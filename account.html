<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121418">
<title>Zoofi · Account en bedrijf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/thema.css">
<script>try{if(localStorage.getItem('sisu.thema')==='donker')document.documentElement.dataset.thema='donker';const tg=localStorage.getItem('sisu.tekst');if(tg==='groot'||tg==='extra')document.documentElement.dataset.tekst=tg;}catch(e){}</script>
<style>
.blok{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px}
.blok h2{margin:0 0 6px;font-size:1.125rem}
.blok p{margin:0 0 12px;color:var(--mute)}
.blok label{display:block;font-weight:700;margin:10px 0 6px}
.blok input,.blok select{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line2);background:var(--well);color:var(--ink);padding:0 14px;font:inherit;font-size:1.0625rem}
.blok input.code{letter-spacing:.2em;font-weight:800;text-transform:uppercase}
.rij{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.rij .btn{flex:1 1 140px}
.melding{margin:10px 0 0;font-weight:700}.melding.fout{color:var(--danger-tekst)}.melding.ok{color:var(--ok-tekst)}
.lijst{list-style:none;margin:8px 0 0;padding:0}
.lijst li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lijst li:first-child{border-top:0}
.lijst .w{flex:1;min-width:0}.lijst .w b{display:block;overflow-wrap:anywhere}.lijst .w small{color:var(--mute)}
.lijst select{width:auto;min-height:44px}
.klein{min-height:44px;padding:0 14px;font-size:.9375rem}
.rood{color:var(--danger-tekst)}
.label{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--card2);font-size:.8125rem;font-weight:700}
.linkvak{word-break:break-all;background:var(--well);border:1.5px dashed var(--line2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.9375rem}
</style>
</head>
<body>
<header class="bar"><a class="back bpill" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Terug</a><h1>Account en bedrijf</h1></header>
<main class="page" id="main"><p class="note">Laden…</p></main>
<script src="shared/thema.js"></script>
<script src="shared/vendor/supabase/supabase.js"></script>
<script src="shared/online.js"></script>
<script>
const $=id=>document.getElementById(id),main=$('main');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROL={beheerder:'Beheerder',beheerder_bedrijf:'Beheerder bedrijf',gebruiker:'Gebruiker'};
const melding=(id,t,ok)=>{const e=$(id);if(e){e.textContent=t||'';e.className='melding '+(ok?'ok':'fout');e.hidden=!t;}};
// uitnodiging uit de link onthouden (ook als je eerst nog moet inloggen)
{const c=new URLSearchParams(location.search).get('uitnodiging');if(c){try{localStorage.setItem('sisu.uitnodiging',c.toUpperCase());}catch(e){}history.replaceState(null,'',location.pathname);}}
const open=()=>{try{return localStorage.getItem('sisu.uitnodiging');}catch(e){return null;}};

async function render(){
  if(!window.Online||!Online.beschikbaar){main.innerHTML='<p class="note">Online werken is nu niet beschikbaar.</p>';return;}
  let p=null;try{p=await Online.profiel();}catch(e){main.innerHTML=`<div class="blok"><h2>Geen verbinding</h2><p>${esc(e.message)}</p><button class="btn" onclick="render()">Opnieuw</button></div>`;return;}
  if(!p)return inlogScherm();
  // openstaande uitnodiging meteen gebruiken
  let ufout='';const oc=open();if(oc){try{await Online.accepteer(oc);p=await Online.profiel();}catch(e){try{localStorage.removeItem('sisu.uitnodiging');}catch(x){}ufout=e.message;}}
  const b=p.bedrijven.find(x=>x.id===p.actief),magBeheren=p.beheerder||(b&&b.rol==='beheerder_bedrijf');
  main.innerHTML=`${ufout?`<div class="blok"><h2>Uitnodiging</h2><p class="melding fout">${esc(ufout)}</p></div>`:''}
  <div class="blok"><h2>Ingelogd</h2><p>${esc(p.user.email)}${p.beheerder?' · <span class="label">Beheerder</span>':''}</p>
    <div class="rij"><button class="btn klein" id="uit">Uitloggen</button></div></div>
  ${p.bedrijven.length?`<div class="blok"><h2>Bedrijf</h2>
    ${p.bedrijven.length>1?`<label for="kies">Werken voor</label><select id="kies">${p.bedrijven.map(x=>`<option value="${x.id}"${x.id===p.actief?' selected':''}>${esc(x.naam)}</option>`).join('')}</select>`:`<p><b style="color:var(--ink)">${esc(b.naam)}</b></p>`}
    <p style="margin-top:10px">Jouw rol: <span class="label">${ROL[b.rol]||b.rol}</span></p></div>`
  :`<div class="blok"><h2>Nog geen bedrijf</h2><p>Je hoort nog niet bij een bedrijf. Vraag een uitnodiging aan de beheerder van je bedrijf, of vul hier je code in.</p>
    <label for="ucode">Uitnodigingscode</label><input id="ucode" class="code" autocapitalize="characters" autocomplete="off" placeholder="bijv. K7M2Q9XA">
    <div class="rij"><button class="btn pri" id="ugo">Meedoen</button></div><p class="melding" id="um" hidden></p>
    ${p.beheerder?'':`<p style="margin-top:16px">Ben jij de eerste gebruiker en zet je Zoofi op? Maak jezelf dan beheerder.</p><div class="rij"><button class="btn" id="wb">Ik ben de beheerder</button></div><p class="melding" id="wbm" hidden></p>`}</div>`}
  ${p.beheerder?`<div class="blok"><h2>Bedrijf aanmaken</h2><p>Alleen de beheerder van Zoofi kan bedrijven aanmaken.</p>
    <label for="bnaam">Naam</label><input id="bnaam" placeholder="bijv. Glasvezel Noord BV"><div class="rij"><button class="btn" id="bgo">Aanmaken</button></div><p class="melding" id="bm" hidden></p></div>`:''}
  ${b&&magBeheren?`<div class="blok"><h2>Collega uitnodigen</h2><p>Je maakt een link die 7 dagen geldig is en één keer gebruikt kan worden. Deel hem via WhatsApp, mail of sms.</p>
    <label for="nrol">Rol</label><select id="nrol"><option value="gebruiker">Gebruiker</option><option value="beheerder_bedrijf">Beheerder bedrijf</option></select>
    <div class="rij"><button class="btn pri" id="ngo">Uitnodiging maken</button></div><div id="nres"></div><p class="melding" id="nm" hidden></p></div>
    <div class="blok"><h2>Collega's</h2><ul class="lijst" id="leden"><li><span class="w">Laden…</span></li></ul></div>
    <div class="blok"><h2>Open uitnodigingen</h2><ul class="lijst" id="uitn"><li><span class="w">Laden…</span></li></ul></div>`:''}`;
  $('uit').onclick=async()=>{await Online.uitloggen();render();};
  if($('kies'))$('kies').onchange=()=>{Online.kiesBedrijf($('kies').value);render();};
  if($('ugo'))$('ugo').onclick=async()=>{const c=$('ucode').value.trim();if(!c)return melding('um','Vul de code in.');try{await Online.accepteer(c);render();}catch(e){melding('um',e.message);}};
  if($('wb'))$('wb').onclick=async()=>{try{const ok=await Online.wordBeheerder();if(ok)render();else melding('wbm','Er is al een beheerder. Vraag hem om een uitnodiging.');}catch(e){melding('wbm',e.message);}};
  if($('bgo'))$('bgo').onclick=async()=>{const n=$('bnaam').value.trim();if(!n)return melding('bm','Vul een naam in.');try{const x=await Online.maakBedrijf(n);Online.kiesBedrijf(x.id);render();}catch(e){melding('bm',e.message);}};
  if(b&&magBeheren){
    $('ngo').onclick=async()=>{const rol=$('nrol').value;try{const u=await Online.maakUitnodiging(b.id,rol);
      const tekst=`Je bent uitgenodigd voor Zoofi (${b.naam}) als ${ROL[rol].toLowerCase()}. Open deze link en log in met je e-mailadres: ${u.link}  (code: ${u.code})`;
      $('nres').innerHTML=`<div class="linkvak">${esc(u.link)}<br>Code: <b>${u.code}</b></div><div class="rij">
        <a class="btn pri" href="https://wa.me/?text=${encodeURIComponent(tekst)}" target="_blank" rel="noopener">Via WhatsApp</a>
        <button class="btn" id="ndeel">Delen…</button><button class="btn" id="nkop">Kopiëren</button></div>`;
      $('ndeel').onclick=()=>{if(navigator.share)navigator.share({title:'Uitnodiging Zoofi',text:tekst}).catch(()=>{});else location.href='mailto:?subject='+encodeURIComponent('Uitnodiging Zoofi')+'&body='+encodeURIComponent(tekst);};
      $('nkop').onclick=async()=>{try{await navigator.clipboard.writeText(tekst);melding('nm','Gekopieerd',true);}catch(e){melding('nm','Kopiëren lukte niet; houd de link ingedrukt.');}};
      lijsten(b,p);}catch(e){melding('nm',e.message);}};
    lijsten(b,p);}
}
async function lijsten(b,p){
  try{const L=await Online.leden(b.id);$('leden').innerHTML=L.length?L.map(l=>`<li><span class="w"><b>${esc(l.email||'—')}</b>${l.user_id===p.user.id?'<small>jij</small>':''}</span>
      <select data-rol="${l.user_id}" aria-label="Rol van ${esc(l.email)}"><option value="gebruiker"${l.rol==='gebruiker'?' selected':''}>Gebruiker</option><option value="beheerder_bedrijf"${l.rol==='beheerder_bedrijf'?' selected':''}>Beheerder bedrijf</option></select>
      ${l.user_id===p.user.id?'':`<button class="btn klein rood" data-weg="${l.user_id}" aria-label="${esc(l.email)} verwijderen">Weg</button>`}</li>`).join(''):'<li><span class="w">Nog geen collega\'s. Nodig iemand uit.</span></li>';
    document.querySelectorAll('[data-rol]').forEach(s=>s.onchange=async()=>{try{await Online.zetRol(b.id,s.dataset.rol,s.value);}catch(e){alert(e.message);}});
    document.querySelectorAll('[data-weg]').forEach(k=>k.onclick=async()=>{if(!confirm('Deze collega uit het bedrijf halen?'))return;try{await Online.verwijderLid(b.id,k.dataset.weg);lijsten(b,p);}catch(e){alert(e.message);}});
  }catch(e){$('leden').innerHTML=`<li><span class="w rood">${esc(e.message)}</span></li>`;}
  try{const U=(await Online.uitnodigingen(b.id)).filter(u=>!u.gebruikt_door);const nu=Date.now();
    $('uitn').innerHTML=U.length?U.map(u=>`<li><span class="w"><b>${u.code}</b><small>${ROL[u.rol]} · ${new Date(u.verloopt)<nu?'verlopen':'geldig tot '+new Date(u.verloopt).toLocaleDateString('nl-NL')}</small></span><button class="btn klein" data-in="${u.code}">Intrekken</button></li>`).join(''):'<li><span class="w">Geen open uitnodigingen.</span></li>';
    document.querySelectorAll('[data-in]').forEach(k=>k.onclick=async()=>{try{await Online.trekIn(k.dataset.in);lijsten(b,p);}catch(e){alert(e.message);}});
  }catch(e){$('uitn').innerHTML=`<li><span class="w rood">${esc(e.message)}</span></li>`;}
}
/* inloggen: e-mail -> mail met link en code; de code werkt ook in de app op het beginscherm */
async function inlogScherm(){const oc=open();let info=null;if(oc)info=await Online.uitnodigingInfo(oc).catch(()=>null);
  let mail='';try{mail=localStorage.getItem('sisu.mail')||'';}catch(e){}
  main.innerHTML=`${oc?`<div class="blok"><h2>Je bent uitgenodigd</h2><p>${info?`Voor <b style="color:var(--ink)">${esc(info.bedrijf)}</b>. `:''}Log hieronder in met je e-mailadres; daarna doe je meteen mee.</p></div>`:''}
  <div class="blok"><h2>Inloggen</h2><p>Je krijgt een mail met een inloglink en een code. Geen wachtwoord nodig.</p>
    <label for="mail">E-mailadres</label><input id="mail" type="email" autocomplete="email" inputmode="email" value="${esc(mail)}" placeholder="naam@bedrijf.nl">
    <div class="rij"><button class="btn pri" id="stuur">Stuur inlogmail</button></div><p class="melding" id="sm" hidden></p>
    <div id="codeblok" hidden><label for="code">Code uit de mail</label><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
      <div class="rij"><button class="btn pri" id="ok">Inloggen</button></div><p class="melding" id="cm" hidden></p>
      <p style="margin-top:12px">Op de iPhone met Zoofi op je beginscherm: gebruik de code. De link opent namelijk in Safari, niet in de app.</p></div></div>`;
  const toon=()=>{$('codeblok').hidden=false;$('code').focus();};
  $('stuur').onclick=async()=>{const m=$('mail').value.trim();if(!/^\S+@\S+\.\S+$/.test(m))return melding('sm','Vul een geldig e-mailadres in.');
    $('stuur').disabled=true;try{await Online.stuurInlog(m);try{localStorage.setItem('sisu.mail',m);}catch(e){}melding('sm','Mail verstuurd. Kijk in je inbox (en spam).',true);toon();}catch(e){melding('sm',e.message);}$('stuur').disabled=false;};
  $('ok').onclick=async()=>{try{await Online.bevestigCode($('mail').value,$('code').value);render();}catch(e){melding('cm',e.message);}};
  $('code').onkeydown=e=>{if(e.key==='Enter')$('ok').click();};
}
Online.onAuth&&Online.onAuth(e=>{if(e==='SIGNED_IN'||e==='SIGNED_OUT')render();});
render();
</script>
</body>
</html>
