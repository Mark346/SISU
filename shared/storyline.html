<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121418">
<title>Zoofi · Afronding</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="stylesheet" href="base.css">
<style>
/* Afronding: de schouw in de vorm van het document (wit papier), op elke regel aan te passen */
.top{margin:6px 0 12px}
.adr{font-size:22px;font-weight:800;margin:4px 0 6px}
.prog{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:15px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--track);overflow:hidden}.prog i b{display:block;height:100%;background:var(--prog-doc)}
.prog .mis{color:var(--warn);font-weight:700}.prog .ok{color:var(--ok);font-weight:700}
.naar{width:100%;margin-top:10px;border-color:var(--warn);color:var(--warn)}
.hint{color:var(--mute);font-size:14px;margin:8px 2px 0}
.doc{background:#fff;color:#111;border-radius:12px;padding:18px 14px 8px;margin-top:6px}
.doc h1{font-size:22px;margin:0}.doc .sub{color:#555;margin:2px 0 6px;font-size:15px}
.doc h2{display:flex;align-items:baseline;gap:8px;font-size:19px;border-bottom:2px solid #FF7A1A;padding-bottom:4px;margin:20px 0 8px}
.doc h2 span{flex:1}.doc h2 small{font-size:13px;font-weight:800;color:#c2410c}
.rows{border:2px solid #111;border-radius:4px;overflow:hidden}
.dr{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 10px;border:0;border-bottom:1px solid #ccc;background:#fff;color:#111;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.dr:last-child{border-bottom:0}.dr:active{background:#f2f2f2}
.dr .l{flex:1 1 52%;min-width:0;line-height:1.3}
.dr .v{flex:1 1 48%;min-width:0;text-align:right;font-weight:600;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.dr.mist{background:#fff3e8}
.dr .pen{flex:none;color:#999}
.dr.tl{cursor:default}.dr.tl .v{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.dr input{width:92px;min-height:42px;text-align:right;border:1px solid #bbb;border-radius:8px;padding:0 8px;font-size:17px;font-weight:700;color:#111;background:#fff}
.dr .stp{width:40px;height:40px;border-radius:20px;border:1px solid #bbb;background:#fff;color:#111;font-size:20px;font-weight:800;cursor:pointer;padding:0}
.dr .mini{width:48px;height:36px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:6px;border:1px solid #ccc}
.ui{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:#FF7A1A;color:#fff;font-style:normal;font-weight:900;font-size:15px;vertical-align:middle;margin-right:6px}
.ont{color:#c2410c;font-weight:800}.leeg{color:#999;font-weight:400}
.db{display:block;width:100%;margin:8px 0;padding:0;border:0;background:none;color:#111;font:inherit;text-align:left;cursor:pointer}
.db .bl{font-weight:700;margin-bottom:6px;font-size:15px}
.db img{max-width:100%;max-height:340px;display:block;border:1px solid #ccc}
.gat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:140px;border:2px dashed #FF7A1A;border-radius:8px;background:#fff3e8;color:#c2410c;font-weight:800;text-align:center;padding:12px}
.gat .ui{width:44px;height:44px;font-size:26px;margin:0}
.gat.stil{border-color:#ccc;background:#f7f7f7;color:#999}
.pc{border:1px solid #ccc;border-radius:8px;margin:10px 0;overflow:hidden}
.pc.vv{opacity:.55}
.pc .ph{position:relative;background:#000;cursor:pointer}
.pc .ph img{display:block;width:100%;height:auto}
.pc .ph.vv img{filter:grayscale(1) brightness(.5)}
.pc .nr{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;font-weight:800;font-size:14px;border-radius:99px;padding:3px 10px;pointer-events:none}
.pc .rl{position:absolute;right:8px;top:8px;background:#FF7A1A;color:#fff;font-weight:800;font-size:13px;border-radius:99px;padding:3px 10px;pointer-events:none}
.pc textarea{display:block;width:calc(100% - 20px);margin:8px 10px;min-height:72px;border-radius:8px;border:1px solid #bbb;background:#fff;color:#111;padding:8px 10px;font-size:16px;line-height:1.4;resize:vertical}
.pc .saved{font-size:13px;color:#15803d;font-weight:800;padding:0 10px;min-height:16px}
.pc .pa{display:flex;gap:6px;padding:0 10px 10px;flex-wrap:wrap}
.pc .pa button{flex:1 1 auto;min-height:44px;border-radius:99px;border:1px solid #bbb;background:#fff;color:#111;font-size:14px;font-weight:700;padding:0 10px;cursor:pointer}
.pc .pa button.mv{flex:none;width:44px;padding:0;font-size:18px}.pc .pa button[disabled]{opacity:.3}
.pc .pa .sct{border-color:var(--sec-buiten);color:#15803d}.pc .pa .sct.binnen{border-color:var(--sec-binnen);color:#6d28d9}
.pc .pa .del.sure{background:#dc2626;border-color:#dc2626;color:#fff}
.vgl{margin:0;padding-left:18px;font-size:15px;line-height:1.45}
.mk{width:100%;margin:6px 0 10px;min-height:48px;border-radius:99px;border:1px solid #111;background:#fff;color:#111;font-weight:800;font-size:15px;cursor:pointer}
.de{padding:10px;border-bottom:1px solid #ccc;background:#fff8f0;box-shadow:inset 4px 0 0 #FF7A1A}
.de .l{display:block;font-weight:800;font-size:15px;margin-bottom:6px;color:#111}
.de input,.de textarea{display:block;box-sizing:border-box;width:100%;min-width:0;min-height:48px;border:1px solid #999;border-radius:8px;padding:0 10px;font-size:17px;color:#111;background:#fff;-webkit-appearance:none;appearance:none}
.de textarea{min-height:90px;padding:8px 10px;line-height:1.4}
.dch{display:flex;flex-wrap:wrap;gap:6px}
.dch button{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid #999;background:#fff;color:#111;font-size:16px;font-weight:700;cursor:pointer}
.dch button.on{background:#111;border-color:#111;color:#fff}
.deb{display:flex;gap:8px;margin-top:10px}
.deb button{flex:1;min-height:48px;border-radius:99px;border:1px solid #999;background:#fff;color:#111;font-size:16px;font-weight:800;cursor:pointer}
.deb button.pri{background:#111;border-color:#111;color:#fff}
.flash{animation:fl 1.2s ease-out}@keyframes fl{0%{box-shadow:0 0 0 4px #FF7A1A}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.foot{position:sticky;bottom:0;margin:20px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px}
.foot .btn{flex:1;min-height:56px;font-size:18px}
.msg{min-height:22px;color:var(--mute)}
</style>
</head>
<body>
<header class="bar"><a class="back bpill" id="back" href="../index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Terug</a><h1>Afronding</h1></header>
<main class="page">
  <div class="top" id="top"></div>
  <p class="msg" id="msg" role="status"></p>
  <div class="doc" id="doc"></div>
  <div class="foot"><button class="btn pri" id="make">Document maken</button></div>
</main>
<script src="store.js"></script>
<script src="legend.js"></script>
<script src="editor.js"></script>
<script src="velden.js"></script>
<script src="camera.js"></script>
<script src="gegevens.js"></script>
<script src="paf.js"></script>
<script src="kaarttrace.js"></script>
<script>
/* Afronding: de schouw in de vorm van het document, per regel en per foto aan te passen,
   voordat het echte document wordt gemaakt. Ontbrekende verplichte onderdelen krijgen een ! */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl1=v=>(Math.round(v*10)/10).toLocaleString('nl-NL',{maximumFractionDigits:1});
const msg=t=>{$('msg').textContent=t||'';};
const id=new URLSearchParams(location.search).get('survey');
let S=null,P=[],urls={};
const PAGE={veeg:'index.html',richt:'richt.html',loop:'loop.html'};
/* tellers die de app zelf bepaalt, per variant (zelfde regels als in de variant) */
const TEL={
  veeg:ph=>({invoeringen:ph.reduce((n,p)=>n+(((p.ann&&p.ann.syms)||[]).filter(x=>x.t==='dv').length),0)}),
  richt:ph=>({meters:Math.round(ph.reduce((t,p)=>t+(p.meters||0),0)*10)/10,metersNote:'schatting kantel-AR',invoeringen:ph.filter(p=>((p.ann&&p.ann.syms)||[]).some(x=>x.t==='dv')).length}),
  loop:ph=>({meters:Math.round(ph.reduce((t,p)=>t+(p.meters||0),0)),metersNote:ph.some(p=>p.meting==='stappen')?'deels stappen':'gps-spoor',invoeringen:ph.some(p=>p.last&&p.eind==='dv')?1:0})
};
async function recount(){
  const ok=P.filter(p=>p.status!=='vervallen'),f=TEL[S.variant];if(!f)return;
  S.tellers={meters:0,invoeringen:0,boringen:0,...S.tellers,...f(ok)};await Store.surveys.put(S);
}
async function load(){
  if(!id){$('doc').innerHTML='<p class="note">Geen schouw gekozen.</p>';$('make').disabled=true;return;}
  S=await Store.surveys.get(id);if(!S){$('doc').innerHTML='<p class="note">Deze schouw is niet gevonden.</p>';$('make').disabled=true;return;}
  $('back').href='../'+(PAGE[S.variant]||'index.html')+'?survey='+encodeURIComponent(S.id);
  P=await Store.photos.bySurvey(S.id,true);
  // naar afronding = status Afronding (vanaf Uitwerking, als er foto's zijn)
  let ch=Velden.migreer(S);if(Velden.adresNaam(S))ch=true;if(window.KaartTrace&&KaartTrace.migreer(S))ch=true;
  for(const p of Velden.onnetFix(S,P)){await Store.photos.put(p);ch=true;} // ONNET: geen buiten tracé
  if(S.status==='archief'&&S.gearchiveerd==null){S.gearchiveerd=true;ch=true;}
  const cur=Velden.statusOf(S);if(S.status!==cur){S.status=cur;ch=true;}
  if(cur==='uitwerking'&&P.some(p=>p.status!=='vervallen')){S.status='afronding';if(!S.eersteFoto)S.eersteFoto=new Date().toISOString();ch=true;}
  if(ch)await Store.surveys.put(S);
  // terug: naar de schouw (in de variant waarin hij gemaakt is)
  $('back').href='../'+({richt:'richt.html',loop:'loop.html'}[S.variant]||'index.html')+'?survey='+encodeURIComponent(S.id);
  // volgorde netjes doornummeren (1, 2, 3 …)
  for(let i=0;i<P.length;i++)if(P[i].volgorde!==i+1){P[i].volgorde=i+1;await Store.photos.put(P[i]);}
  await recount();render();
}
const UIT='<i class="ui" aria-hidden="true">!</i>';
const ONT=UIT+'<span class="ont">Ontbreekt</span>';
const fmtD=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric'});};
const pagina=x=>'../'+({richt:'richt.html',loop:'loop.html'}[S.variant]||'index.html')+'?survey='+encodeURIComponent(S.id)+(x&&!['richt','loop'].includes(S.variant)?'&fotos='+x:'');
/* fotonummers zoals in het document */
function nummers(){const c=Velden.cfg(),nr={};let n=0;
  for(const f of Velden.VELDEN)if(f.t==='fotos'&&c[f.k].uit!=='nee'&&Velden.actief(S,f))P.filter(p=>p.status!=='vervallen'&&(p.sectie||'buiten')===f.sectie).forEach(p=>nr[p.id]=++n);return nr;}
const ROLNAAM=r=>{const f=Velden.VELDEN.find(v=>v.rol===r);return f?(f.kort||f.l):'';};
function render(){
  Object.values(urls).forEach(u=>URL.revokeObjectURL(u));urls={};P.forEach(p=>urls[p.id]=URL.createObjectURL(p.blob));
  const c=Velden.cfg(),vo=Velden.voortgang(S,P,'uit'),nr=nummers(),T=S.tellers||{},on=Velden.onnet(S);
  const binnen=!on&&(c.binnen_fotos.in!=='nee'||c.binnen_fotos.uit!=='nee');
  $('top').innerHTML=`<div class="adr">${esc(S.adres||'Schouw')}</div>
    <div class="prog"><span class="${vo.mist.length?'mis':'ok'}">Document ${vo.klaar} van ${vo.totaal} compleet</span><i><b style="width:${vo.pct}%"></b></i></div>
    ${vo.mist.length?`<button class="btn naar" id="naar">${UIT.replace('class="ui"','class="ui" style="background:var(--warn);color:#1a1400"')}Naar eerste ontbrekende (${vo.mist.length})</button>`:''}
    <p class="hint">Zo komt het in het document. Tik op een regel of foto om aan te passen.</p>`;
  volg=[];open=[];
  const sectieHtml=sc=>{
    const fs=Velden.VELDEN.filter(f=>f.s===sc.id&&c[f.k].uit!=='nee'&&!f.schakel&&!(f.als&&f.als.niet!=null&&!Velden.actief(S,f)));
    if(!fs.length)return'';
    let out='',rij=[],mis=0;const flush=()=>{if(rij.length){out+=`<div class="rows">${rij.join('')}</div>`;rij=[];}};
    for(const f of fs){
      const verpl=c[f.k].uit==='verplicht',act=Velden.actief(S,f),vol=act&&Velden.gevuld(S,f,P),mist=act&&verpl&&!vol,v=Velden.waarde(S,f.k);if(mist)mis++;
      const lab=esc(f.l);
      if(!act){rij.push(`<button class="dr" data-sec="${Velden.groep(f)}"><span class="l">${lab}</span><span class="v">N.v.t</span></button>`);continue;}
      switch(f.t){
        case 'teller':{let ctl='';
          if(f.teller==='meters')ctl=S.variant==='veeg'?`<input data-tel="meters" inputmode="decimal" value="${esc(T.meters||'')}" placeholder="0" aria-label="${lab}"> m`:`${nl1(T.meters||0)} m${T.metersNote?' ('+esc(T.metersNote)+')':''}`;
          else if(f.teller==='metersBinnen')ctl=`<input data-tel="metersBinnen" inputmode="decimal" value="${esc(T.metersBinnen!=null?T.metersBinnen:'')}" placeholder="0" aria-label="${lab}"> m`;
          else if(f.teller==='boringen')ctl=`<button class="stp" data-bor="-1" aria-label="Eén minder">−</button><b id="tb">${T.boringen||0}</b><button class="stp" data-bor="1" aria-label="Eén meer">+</button>`;
          else ctl=`<b>${esc(v==null?0:v)}</b>`;
          rij.push(`<div class="dr tl${mist?' mist':''}" data-k="${f.k}"><span class="l">${mist?UIT:''}${lab}</span><span class="v">${ctl}</span></div>`);break;}
        case 'rolfoto':{const p=P.find(q=>q.status!=='vervallen'&&q.rol===f.rol);
          rij.push(`<button class="dr${mist?' mist':''}" data-rol="${f.k}"><span class="l">${lab}</span><span class="v">${p?`<img class="mini" src="${urls[p.id]}" alt="">${nr[p.id]?'Foto '+nr[p.id]:'Ja'}`:mist?ONT:'<span class="leeg">—</span>'}</span></button>`);break;}
        case 'foto':{flush();const bp=P.find(p=>p.id===(S.bijlageBron||{})[f.k]&&p.status!=='vervallen'),b=bp?bp.blob:(S.bijlagen||{})[f.k];let u='';if(b){u=URL.createObjectURL(b);urls['b_'+f.k]=u;}
          out+=`<button class="db${mist?' mist':''}" ${f.k==='afw_foto'?'data-kast="1"':f.k==='trace_geo'&&window.KaartTrace?'data-kaart="1"':`data-sec="${Velden.groep(f)}"`}><div class="bl">${lab}</div>${b?(bp&&bp.ann?`<div class="phb" data-bron="${bp.id}" style="position:relative"><img src="${u}" alt="${lab}" style="display:block;width:100%"></div>`:`<img src="${u}" alt="${lab}">`):v==='nvt'?`<p><b>${esc(f.nvt||'Niet beschikbaar')}</b></p>`:`<div class="gat${mist?'':' stil'}">${mist?'<i class="ui">!</i>':''}${f.k==='trace_geo'&&window.KaartTrace?(mist?'Kaart ontbreekt':'Geen kaart')+' · tik om te importeren':(mist?'Foto ontbreekt':'Geen foto')+' · tik om toe te voegen'}</div>`}${b&&f.k==='trace_geo'&&window.KaartTrace?'<div style="margin-top:6px;font-size:14px;color:#666;font-weight:600">✎ Tik om het tracé aan te passen</div>':''}</button>`;break;}
        case 'fotos':{flush();const L=P.map((p,i)=>({p,i})).filter(x=>(x.p.sectie||'buiten')===f.sectie);
          out+=L.length?L.map(({p,i})=>kaart(p,i,nr,binnen)).join(''):`<div class="gat${mist?'':' stil'}">${mist?'<i class="ui">!</i>':''}Nog geen foto's ${esc(f.sectie)}</div>`;
          out+=`<button class="mk" data-naar="${f.sectie}">Foto's ${esc(f.sectie)} maken</button>`;break;}
        case 'vg':{flush();const it=(v&&v.items)||{},A=Velden.VG.filter(a=>it[a.id]&&it[a.id].aan);
          out+=`<div class="rows"><button class="dr${mist?' mist':''}" data-sec="vg"><span class="l">${mist?ONT+' · V&amp;G nog niet nagelopen':A.length?`<ul class="vgl">${A.map(a=>`<li>${esc(a.aspect)}</li>`).join('')}</ul>`:'V&amp;G nagelopen: geen bijzonderheden'}</span></button></div>`;break;}
        case 'legenda':flush();out+='<p class="leeg" style="font-size:14px">De legenda komt automatisch in het document.</p>';break;
        default:{const t=f.t==='datum'?fmtD(v):(v==null?'':String(v)),hier=kanHier(f);
          if(hier){volg.push(f.k);if(mist)open.push(f.k);}
          if(bewerk===f.k&&hier){rij.push(editor(f,v));break;}
          rij.push(`<button class="dr${mist?' mist':''}" ${hier?`data-k="${f.k}"`:`data-sec="${Velden.groep(f)}"`}><span class="l">${lab}</span><span class="v">${vol?esc(t):mist?ONT:'<span class="leeg">—</span>'}</span></button>`);}
      }
    }
    flush();
    return `<h2><span>${esc(sc.naam)}</span>${mis?`<small>${mis} ontbreekt</small>`:''}</h2>${out}`;
  };
  $('doc').innerHTML=`<h1>Site survey</h1><p class="sub">${esc(S.adres||'')}${Velden.waarde(S,'datum_survey')?' · '+esc(fmtD(Velden.waarde(S,'datum_survey'))):''}</p>`
    +Velden.SECTIES.map(sectieHtml).join('');
  document.querySelectorAll('.phb[data-bron]').forEach(el=>{const p=P.find(x=>x.id===el.dataset.bron);if(p&&p.ann)Legend.render(el,p.ann);});
  document.querySelectorAll('.pc .ph').forEach(el=>{const p=P[+el.dataset.ed];if(p.ann)Legend.render(el,p.ann);});
  bind();
}
/* één foto als kaart in het document: foto met pijlen, bijschrift, knoppen */
function kaart(p,i,nr,binnen){
  const vv=p.status==='vervallen',sx=p.sectie||'buiten',same=j=>j>=0&&j<P.length&&(P[j].sectie||'buiten')===sx;
  let up=i-1;while(up>=0&&!same(up))up--;let dn=i+1;while(dn<P.length&&!same(dn))dn++;
  return `<article class="pc${vv?' vv':''}" data-i="${i}">
    <div class="ph${vv?' vv':''}" data-ed="${i}" role="button" tabindex="0" aria-label="Foto ${nr[p.id]||''} bewerken"><img src="${urls[p.id]}" alt=""><span class="nr">${vv?'Vervalt':'Foto '+(nr[p.id]||'')}</span>${p.rol&&!vv?`<span class="rl">${esc(ROLNAAM(p.rol))}</span>`:''}</div>
    <textarea id="tx${i}" data-tx="${i}" ${vv?'disabled':''} aria-label="Bijschrift foto ${nr[p.id]||''}" placeholder="Schrijf wat hier gebeurt">${esc(p.bijschrift||'')}</textarea>
    <div class="saved" id="sv${i}"></div>
    <div class="pa"><button data-ed="${i}">Bewerken</button><button class="mv" data-mv="${i}" data-d="-1" aria-label="Foto omhoog" ${up<0?'disabled':''}>↑</button><button class="mv" data-mv="${i}" data-d="1" aria-label="Foto omlaag" ${dn>=P.length?'disabled':''}>↓</button>
      ${binnen?`<button class="sct${sx==='binnen'?' binnen':''}" data-sct="${i}" aria-label="Naar ${sx==='binnen'?'buiten':'binnen'}">${sx==='binnen'?'Binnen':'Buiten'}</button>`:''}<button data-vv="${i}">${vv?'Terugzetten':'Vervalt'}</button><button class="del" data-del="${i}">Verwijderen</button></div>
  </article>`;
}
/* direct in de afronding invullen: één regel tegelijk, met "Volgende" naar het volgende lege verplichte veld */
let bewerk=null,volg=[],open=[],svT=null;
const kanHier=f=>!Velden.verborgen(S,f)&&['text','lang','datum','tel','mail','getal','keuze','janee'].includes(f.t);
function editor(f,v){
  const id='e_'+f.k,ph=esc(f.vb?'bijv. '+f.vb:'');
  const inv=f.t==='keuze'||f.t==='janee'?`<div class="dch" role="group" aria-labelledby="l_${f.k}">${(f.t==='janee'?['Ja','Nee']:f.opties).map(o=>`<button data-kz="${esc(o)}" class="${v===o?'on':''}" aria-pressed="${v===o}">${esc(o)}</button>`).join('')}</div>`
    :f.t==='lang'?`<textarea id="${id}" data-ein placeholder="${ph}">${esc(v||'')}</textarea>`
    :`<input id="${id}" data-ein type="${{datum:'date',tel:'tel',mail:'email',getal:'number'}[f.t]||'text'}" value="${esc(v==null?'':v)}" placeholder="${ph}" enterkeyhint="next"${f.t==='getal'?' inputmode="numeric"':''}>`;
  return `<div class="de" data-ek="${f.k}"><label class="l" id="l_${f.k}" for="${id}">${esc(f.l)}</label>${inv}
    <div class="deb"><button data-ed2="klaar">Klaar</button><button class="pri" data-ed2="volg">Volgende ›</button></div></div>`;
}
function opslaanNu(){clearTimeout(svT);svT=null;return S?Store.surveys.put(S):null;}
function bewerkOpen(k){bewerk=k;render();const el=document.querySelector(`.de[data-ek="${k}"]`);if(!el)return;
  el.scrollIntoView({block:'center',behavior:'smooth'});const i=el.querySelector('[data-ein]');if(i)i.focus({preventScroll:true});}
async function volgende(){const k=bewerk;await opslaanNu();bewerk=null;render(); // eerst opnieuw tellen wat nog leeg is
  const pos=volg.indexOf(k),na=open.find(x=>volg.indexOf(x)>pos)||open.find(x=>x!==k);
  if(na)bewerkOpen(na);else{msg('Alle tekstvelden zijn ingevuld.');const m=document.querySelector('#doc .mist');if(m)m.scrollIntoView({block:'center',behavior:'smooth'});}}
function bindEditor(){const el=document.querySelector('.de');if(!el)return;const k=el.dataset.ek,f=Velden.VELDEN.find(x=>x.k===k);
  const i=el.querySelector('[data-ein]');
  if(i){i.oninput=()=>{Velden.zet(S,k,i.value);clearTimeout(svT);svT=setTimeout(opslaanNu,400);};
    i.onkeydown=e=>{if(e.key==='Enter'&&f.t!=='lang'){e.preventDefault();volgende();}};}
  el.querySelectorAll('[data-kz]').forEach(b=>b.onclick=async()=>{const on=Velden.waarde(S,k)===b.dataset.kz;Velden.zet(S,k,on?'':b.dataset.kz);await opslaanNu();
    if(on){bewerkOpen(k);}else volgende();});
  el.querySelector('[data-ed2="klaar"]').onclick=async()=>{await opslaanNu();bewerk=null;render();};
  el.querySelector('[data-ed2="volg"]').onclick=volgende;
}
function bind(){
  bindEditor();
  document.querySelectorAll('.dr[data-k]').forEach(b=>b.onclick=async()=>{if(bewerk)await opslaanNu();bewerkOpen(b.dataset.k);});
  const opnieuw=async()=>{P=await Store.photos.bySurvey(S.id,true);await recount();render();};
  if($('naar'))$('naar').onclick=()=>{const m=document.querySelector('#doc .mist');if(m&&m.dataset.k){bewerkOpen(m.dataset.k);return;}if(m){m.scrollIntoView({block:'center',behavior:'smooth'});m.classList.remove('flash');void m.offsetWidth;m.classList.add('flash');}};
  document.querySelectorAll('[data-kaart]').forEach(b=>b.onclick=()=>KaartTrace.open(S,opnieuw));
  document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>Gegevens.open(S,{filter:'alles',sectie:b.dataset.sec,onClose:opnieuw}));
  document.querySelectorAll('[data-rol]').forEach(b=>b.onclick=()=>{const f=Velden.VELDEN.find(v=>v.k===b.dataset.rol);
    Gegevens.rolBlad(S,f,{klaar:opnieuw,maak:g=>Camera.take({galerij:g}).then(async r=>{if(!r||!r.blob)return;
      const p=await Store.photos.put({surveyId:S.id,blob:r.blob,ann:{orient:r.orient||'liggend'},bron:S.variant||'veeg',status:'ok',sectie:f.sectie});
      await Gegevens.zetRol(p,f.rol,await Store.photos.bySurvey(S.id,true));P=await Store.photos.bySurvey(S.id,true);await recount();render();edit(P.findIndex(x=>x.id===p.id));}).catch(()=>msg('Foto maken lukte niet'))});});
  document.querySelectorAll('[data-kast]').forEach(b=>b.onclick=()=>Gegevens.rolBlad(S,Velden.VELDEN.find(v=>v.k==='afw_foto'),{klaar:opnieuw,
    maak:g=>Camera.take({galerij:g}).then(async r=>{if(!r||!r.blob)return;const p=await Store.photos.put({surveyId:S.id,blob:r.blob,ann:{orient:r.orient||'liggend'},bron:S.variant||'veeg',status:'ok',sectie:'binnen'});S.bijlagen={...(S.bijlagen||{}),afw_foto:r.blob};S.kastGevraagd=true;S.bijlageBron={...(S.bijlageBron||{}),afw_foto:p.id};await Store.surveys.put(S);await opnieuw();}).catch(()=>msg('Foto maken lukte niet'))}));
  document.querySelectorAll('[data-naar]').forEach(b=>b.onclick=()=>{location.href=pagina(b.dataset.naar);});
  document.querySelectorAll('[data-ed]').forEach(el=>{el.onclick=()=>edit(+el.dataset.ed);el.onkeydown=e=>{if(e.key==='Enter')edit(+el.dataset.ed);};});
  document.querySelectorAll('[data-sct]').forEach(b=>b.onclick=async()=>{const p=P[+b.dataset.sct];p.sectie=p.sectie==='binnen'?'buiten':'binnen';if(p.rol){delete p.rol;}await Store.photos.put(p);render();});
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>move(+b.dataset.mv,+b.dataset.d));
  document.querySelectorAll('[data-vv]').forEach(b=>b.onclick=()=>toggleVv(+b.dataset.vv));
  document.querySelectorAll('[data-del]').forEach(b=>{let t=null;b.onclick=()=>{
    if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='Zeker? Tik nog eens';t=setTimeout(()=>{b.classList.remove('sure');b.textContent='Verwijderen';},3000);return;}
    clearTimeout(t);del(+b.dataset.del);};});
  document.querySelectorAll('[data-tx]').forEach(t=>{let tm=null;t.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>saveText(+t.dataset.tx,t.value),400);};t.onblur=()=>{clearTimeout(tm);saveText(+t.dataset.tx,t.value);};});
  document.querySelectorAll('[data-tel]').forEach(i=>i.onchange=async()=>{const v=parseFloat(i.value.replace(',','.'));S.tellers={...S.tellers,[i.dataset.tel]:isFinite(v)?v:0};await Store.surveys.put(S);msg('Opgeslagen');render();});
  document.querySelectorAll('[data-bor]').forEach(b=>b.onclick=async()=>{const n=Math.max(0,((S.tellers||{}).boringen||0)+(+b.dataset.bor));S.tellers={...S.tellers,boringen:n};await Store.surveys.put(S);render();});
  // hoofdknop: compleet = "Document maken", anders "Toch afronden (X open)"
  const vo=Velden.voortgang(S,P,'uit');
  $('make').textContent=Velden.statusOf(S)!=='klaar'&&vo.mist.length?`Toch afronden (${vo.mist.length} open)`:'Document maken';
}
async function saveText(i,v){
  const p=P[i];if(!p||(p.bijschrift||'')===v)return;
  p.bijschrift=v;p.cap={auto:false,sel:[],lo:'',vrij:v};await Store.photos.put(p);
  const s=$('sv'+i);if(s){s.textContent='Opgeslagen';setTimeout(()=>{if(s)s.textContent='';},1500);}
}
async function move(i,d){
  const sx=P[i].sectie||'buiten';let j=i+d;while(j>=0&&j<P.length&&(P[j].sectie||'buiten')!==sx)j+=d; // binnen dezelfde sectie
  if(j<0||j>=P.length)return;[P[i],P[j]]=[P[j],P[i]];
  for(let k=0;k<P.length;k++){P[k].volgorde=k+1;await Store.photos.put(P[k]);}
  render();const el=document.querySelector(`.pc[data-i="${j}"]`);if(el)el.scrollIntoView({block:'nearest'});
}
async function del(i){
  const p=P[i];await Store.photos.del(p.id);P.splice(i,1);
  for(let k=0;k<P.length;k++)if(P[k].volgorde!==k+1){P[k].volgorde=k+1;await Store.photos.put(P[k]);}
  await recount();render();msg('Foto verwijderd.');
}
async function toggleVv(i){const p=P[i];p.status=p.status==='vervallen'?'ok':'vervallen';await Store.photos.put(p);await recount();render();msg(p.status==='vervallen'?'Foto vervalt: niet in het document.':'Foto teruggezet.');}
function edit(i){
  const p=P[i];if(p.status==='vervallen'){msg('Zet de foto eerst terug om hem te bewerken.');return;}
  Editor.openEditor(p.id,{onClose:async()=>{P=await Store.photos.bySurvey(S.id,true);await recount();render();},
    onChange:async q=>{if(S.variant==='loop'){q.bron='loop';q.bijgeveegd=true;await Store.photos.put(q);}}}).catch(e=>msg('Kon de foto niet openen: '+(e.message||e)));
}
Gegevens.bron=k=>S&&S.id===k?S:null;
function binnenAan(){const c=Velden.cfg().binnen_fotos;return c.in!=='nee'||c.uit!=='nee';}
/* Document maken: compleet -> status Klaar en naar het document; niet compleet -> één keer bevestigen, dan Klaar met de lijst wat open is */
$('make').onclick=async()=>{
  const a=document.activeElement;if(a&&a.dataset&&a.dataset.tx!=null)await saveText(+a.dataset.tx,a.value);
  await opslaanNu();S=Gegevens.bron(S.id)||S;
  const vo=Velden.voortgang(S,P,'uit');
  if(vo.mist.length){
    if(Velden.statusOf(S)!=='klaar'){
      const k=await Gegevens.vraag(`Toch afronden met ${vo.mist.length} open?`,'Nog niet ingevuld: '+vo.mist.slice(0,8).map(f=>f.kort||f.l).join(', ')+(vo.mist.length>8?' en '+(vo.mist.length-8)+' meer':'')+'. Je kunt het daarna nog aanvullen.',[['toch','Toch afronden','pri'],['terug','Terug','']]);
      if(k!=='toch')return;}
    S.onvolledig={op:new Date().toISOString(),mist:vo.mist.map(f=>f.l)};
  }else delete S.onvolledig;
  S.status='klaar';await Store.surveys.put(S);
  location.href='document.html?survey='+encodeURIComponent(S.id);
};
load().catch(e=>msg('Kon de opslag niet openen: '+(e.message||e)));
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
